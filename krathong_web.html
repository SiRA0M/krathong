<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loy Krathong 3D High-Detail ASCII Panorama</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000000;
        }
        body, html {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000000;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
    <canvas id="asciiCanvas"></canvas>

    <script>
        const canvas = document.getElementById('asciiCanvas');
        const ctx = canvas.getContext('2d');

        // High-density character grid resolution
        const FONT_SIZE = 12;
        const CHAR_W = 7.2;
        const CHAR_H = 12.0;

        let COLS = 0;
        let ROWS = 0;

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            COLS = Math.floor(canvas.width / CHAR_W);
            ROWS = Math.floor(canvas.height / CHAR_H);
            initBackground();
        }

        // Palette & Character Sets
        const DENSE = ["@", "%", "#", "&", "8", "0", "W", "B", "M", "Q"];
        const MID   = ["o", "*", "=", "+", "a", "e", "s", "1", "0", "x", "z"];
        const LIGHT = ["-", "~", ":", ".", "'", "`", "^", "|", "/", "\\"];

        // =========================================================
        // 1. HIGH-DETAIL 3D MATHEMATICAL PARAMETRIC KRATHONG MODEL
        // =========================================================
        const krathong3DPoints = []; // [x, y, z]
        const krathong3DColors = []; // [r, g, b]
        const krathong3DTypes  = []; // 'leaf', 'petal_out', 'petal_mid', 'petal_in', 'flower', 'base', 'candle', 'incense'

        function mix(c1, c2, t) {
            t = Math.max(0, Math.min(1, t));
            return [
                c1[0] * (1 - t) + c2[0] * t,
                c1[1] * (1 - t) + c2[1] * t,
                c1[2] * (1 - t) + c2[2] * t
            ];
        }

        // Build a curved 3D petal using trigonometric cupping equations
        function build3DPetal(a, op, ln, wd, y0, r0, type) {
            const uSteps = 22; // High longitudinal density
            const vSteps = 12; // High lateral density

            for (let i = 0; i < uSteps; i++) {
                const u = 0.02 + (i / (uSteps - 1)) * 0.98;
                for (let j = 0; j < vSteps; j++) {
                    const v = (j / (vSteps - 1)) * 2.0 - 1.0;

                    // Pointed oval profile with realistic taper
                    const sinVal = Math.sin(Math.PI * Math.pow(Math.min(1, Math.max(0, u)), 0.75));
                    const w = wd * Math.pow(Math.max(0, sinVal), 0.8) + 0.004;
                    const ly = u * ln;

                    // 3D Cupping curvature (ความโค้งเว้าเป็นแอ่งรูปกลีบดอกไม้)
                    const zl = 0.55 * wd * (1.0 - v * v) * (1.0 - 0.45 * u);

                    // Opening tilt angle 'op'
                    const y = ly * Math.cos(op) - zl * Math.sin(op);
                    const z = r0 + ly * Math.sin(op) + zl * Math.cos(op);
                    const x = v * w;

                    // Rotate around Y-axis by azimuth angle 'a'
                    const cosA = Math.cos(a), sinA = Math.sin(a);
                    const xr = x * cosA + z * sinA;
                    const zr = -x * sinA + z * cosA;
                    const yr = y + y0;

                    // Detailed material coloring
                    let col;
                    if (type === 'leaf') {
                        // Banana leaf: lime & vibrant emerald green with yellow edge highlights
                        const baseCol = mix([40, 130, 25], [150, 225, 45], u);
                        const edge = 0.35 * Math.pow(Math.abs(v), 4);
                        col = mix(baseCol, [195, 240, 75], edge);
                    } else if (type === 'petal_out') {
                        // Outer lotus petal: deep rich magenta/rose to pink
                        col = mix([255, 185, 215], [245, 55, 140], Math.pow(u, 1.2));
                    } else if (type === 'petal_mid') {
                        // Mid lotus petal: soft blushing pink to warm gold gradient
                        col = mix([255, 230, 245], [255, 105, 180], Math.pow(u, 1.3));
                    } else if (type === 'petal_in') {
                        // Inner lotus petal: delicate ivory pink to golden yellow
                        col = mix([255, 248, 220], [255, 160, 200], Math.pow(u, 1.4));
                    } else if (type === 'flower') {
                        // Marigold flower accent: radiant golden yellow
                        col = mix([255, 215, 50], [255, 140, 20], u);
                    }

                    krathong3DPoints.push([xr, yr, zr]);
                    krathong3DColors.push(col);
                    krathong3DTypes.push(type);
                }
            }
        }

        function initKrathongModel() {
            krathong3DPoints.length = 0;
            krathong3DColors.length = 0;
            krathong3DTypes.length = 0;

            // 1. Layer 1: Outermost Banana Leaf Folds (ฐานกลีบใบตองพับ 18 กลีบ บานออกกว้าง)
            const numLeaves = 18;
            for (let i = 0; i < numLeaves; i++) {
                const ang = (i / numLeaves) * Math.PI * 2;
                build3DPetal(ang, 1.38, 1.45, 0.48, -0.15, 0.95, 'leaf');
            }

            // 2. Layer 2: Outermost Lotus Petals (กลีบดอกบัวชั้นนอก 16 กลีบ บานกำลังดี)
            const numPOut = 16;
            for (let i = 0; i < numPOut; i++) {
                const ang = ((i + 0.5) / numPOut) * Math.PI * 2;
                build3DPetal(ang, 1.10, 1.32, 0.44, -0.08, 0.78, 'petal_out');
            }

            // 3. Layer 3: Middle Lotus Petals (กลีบดอกบัวชั้นกลาง 14 กลีบ ชูชันขึ้น)
            const numPMid = 14;
            for (let i = 0; i < numPMid; i++) {
                const ang = (i / numPMid) * Math.PI * 2;
                build3DPetal(ang, 0.78, 1.18, 0.40, -0.02, 0.58, 'petal_mid');
            }

            // 4. Layer 4: Inner Lotus Petals (กลีบดอกบัวชั้นใน 12 กลีบ โอบรับเกสร)
            const numPIn = 12;
            for (let i = 0; i < numPIn; i++) {
                const ang = ((i + 0.5) / numPIn) * Math.PI * 2;
                build3DPetal(ang, 0.42, 1.02, 0.35, 0.04, 0.38, 'petal_in');
            }

            // 5. Layer 5: Marigold / Floral Ring (พวงดอกดาวเรืองทองอร่ามล้อมฐานเทียน)
            const numFlowers = 10;
            for (let i = 0; i < numFlowers; i++) {
                const ang = (i / numFlowers) * Math.PI * 2;
                build3DPetal(ang, 0.22, 0.70, 0.28, 0.08, 0.22, 'flower');
            }

            // 6. Base disc (ท่อนกล้วยรองฐานกระทง)
            for (let r = 0.25; r <= 1.40; r += 0.12) {
                for (let a = 0; a < Math.PI * 2; a += Math.PI / 16) {
                    const x = r * Math.cos(a);
                    const z = r * Math.sin(a);
                    krathong3DPoints.push([x, -0.12, z]);
                    krathong3DColors.push([45, 105, 30]);
                    krathong3DTypes.push('base');

                    krathong3DPoints.push([x, -0.24, z]);
                    krathong3DColors.push([32, 75, 20]);
                    krathong3DTypes.push('base');
                }
            }

            // 7. 3D Candle Cylinder (เทียนแท่งทรงกระบอก 3 มิติ ตรงกลาง)
            for (let h = 0.05; h <= 1.05; h += 0.07) {
                for (let a = 0; a < Math.PI * 2; a += Math.PI / 6) {
                    const rCandle = 0.10;
                    krathong3DPoints.push([rCandle * Math.cos(a), h, rCandle * Math.sin(a)]);
                    krathong3DColors.push([255, 245, 195]);
                    krathong3DTypes.push('candle');
                }
            }

            // 8. 3 Incense Sticks (ธูป 3 ดอก ปักเอียงสมจริง)
            const incenseAngles = [-0.18, 0.0, 0.18];
            for (let idx = 0; idx < 3; idx++) {
                const tilt = incenseAngles[idx];
                for (let h = 0.05; h <= 1.55; h += 0.08) {
                    const xi = (idx - 1) * 0.08 + Math.sin(tilt) * h;
                    const zi = 0.08 + Math.cos(tilt) * 0.02;
                    const isTip = (h >= 1.45);
                    krathong3DPoints.push([xi, h, zi]);
                    krathong3DColors.push(isTip ? [255, 130, 40] : [160, 80, 45]);
                    krathong3DTypes.push('incense');
                }
            }
        }
        initKrathongModel();

        // =========================================================
        // 2. BACKGROUND PANORAMA DATA (STARS, LANTERNS, MOON)
        // =========================================================
        let stars = [];
        let lanterns = [];

        function initBackground() {
            stars = [];
            const numStars = Math.floor(COLS * 0.85);
            const starChars = [".", "+", "*", "·", "'", "`"];
            for (let i = 0; i < numStars; i++) {
                stars.push({
                    x: Math.random(),
                    y: Math.random() * 0.44,
                    char: starChars[Math.floor(Math.random() * starChars.length)],
                    speed: 1.2 + Math.random() * 2.8,
                    phase: Math.random() * Math.PI * 2
                });
            }

            lanterns = [
                { x: 0.17, y: 0.18, lines: ["7&8#", "#8*:"], speed: 0.016 },
                { x: 0.28, y: 0.28, lines: ["488", "1&85"], speed: 0.013 },
                { x: 0.50, y: 0.12, lines: ["100#", "%&0#*", "9&8"], speed: 0.011 },
                { x: 0.63, y: 0.22, lines: ["84&#", "%&0#*", "7#"], speed: 0.015 },
                { x: 0.08, y: 0.25, lines: ["8#", "*:"], speed: 0.010 },
                { x: 0.38, y: 0.20, lines: ["88", "1&"], speed: 0.009 },
                { x: 0.74, y: 0.32, lines: ["40#", "98"], speed: 0.014 },
                { x: 0.88, y: 0.16, lines: ["80", "*"], speed: 0.008 },
                { x: 0.94, y: 0.26, lines: ["#8", "&"], speed: 0.011 }
            ];
        }

        const moonLines = [
            "    #@0000000000@..    ",
            "  +0&@000000000&0000+  ",
            " 00000000000000&000000 ",
            "00000000&0000000000000 ",
            "0000000000000000000000 ",
            "0000000000000000000000 ",
            " 00000000000000000000  ",
            " &000000000000000000   ",
            "  +0000000000000000    ",
            "   +0000000000000      ",
            "     +000000000        "
        ];

        window.addEventListener('resize', resize);
        resize();

        const startTime = Date.now();

        function render() {
            const t = (Date.now() - startTime) * 0.001;

            // Clear black screen
            ctx.fillStyle = "#000000";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Buffers
            const gridChar = new Array(ROWS);
            const gridR = new Array(ROWS);
            const gridG = new Array(ROWS);
            const gridB = new Array(ROWS);
            const gridGlow = new Array(ROWS); // 0=None, 1=Subtle, 2=Intense
            const gridZ = new Array(ROWS);    // Depth buffer for correct 3D occlusion

            for (let r = 0; r < ROWS; r++) {
                gridChar[r] = new Array(COLS).fill(" ");
                gridR[r] = new Float32Array(COLS);
                gridG[r] = new Float32Array(COLS);
                gridB[r] = new Float32Array(COLS);
                gridGlow[r] = new Uint8Array(COLS);
                gridZ[r] = new Float32Array(COLS).fill(-99999.0);
            }

            const horizonR = Math.floor(ROWS * 0.46);
            const centerC = Math.floor(COLS * 0.50);

            // ==========================================
            // 1. SKY & STARS
            // ==========================================
            for (let s of stars) {
                const sc = Math.floor(s.x * COLS);
                const sr = Math.floor(s.y * ROWS);
                if (sr < horizonR && sc >= 0 && sc < COLS) {
                    const shimmer = Math.sin(t * s.speed + s.phase) * 0.5 + 0.5;
                    if (shimmer > 0.3) {
                        gridChar[sr][sc] = s.char;
                        const bright = 175 + shimmer * 80;
                        gridR[sr][sc] = bright;
                        gridG[sr][sc] = bright;
                        gridB[sr][sc] = Math.min(255, bright + 15);
                        if (shimmer > 0.85) gridGlow[sr][sc] = 1;
                    }
                }
            }

            // ==========================================
            // 2. FULL MOON (@ & 0 WITH AURA)
            // ==========================================
            const moonCenterC = Math.floor(COLS * 0.78);
            const moonCenterR = Math.floor(ROWS * 0.16);
            const moonHalfW = Math.floor(moonLines[0].length / 2);
            const moonHalfH = Math.floor(moonLines.length / 2);
            const moonStartC = moonCenterC - moonHalfW;
            const moonStartR = moonCenterR - moonHalfH;

            // Halo
            for (let dr = -moonHalfH - 8; dr <= moonHalfH + 12; dr++) {
                const r = moonCenterR + dr;
                if (r < 0 || r >= horizonR) continue;
                for (let dc = -moonHalfW - 14; dc <= moonHalfW + 18; dc++) {
                    const c = moonCenterC + dc;
                    if (c < 0 || c >= COLS) continue;
                    const dNorm = Math.sqrt((dc / (moonHalfW + 10)) ** 2 + (dr / (moonHalfH + 7)) ** 2);
                    if (dNorm > 0.92 && dNorm <= 1.85) {
                        const aura = (1.0 - (dNorm - 0.92) / 0.93);
                        if (Math.random() < aura * 0.42) {
                            gridChar[r][c] = (dr + dc) % 2 === 0 ? "·" : "+";
                            gridR[r][c] = 235 * aura;
                            gridG[r][c] = 225 * aura;
                            gridB[r][c] = 195 * aura;
                            gridGlow[r][c] = 1;
                        }
                    }
                }
            }

            // Solid Moon Body
            for (let mr = 0; mr < moonLines.length; mr++) {
                const line = moonLines[mr];
                const r = moonStartR + mr;
                if (r < 0 || r >= horizonR) continue;
                for (let mc = 0; mc < line.length; mc++) {
                    const ch = line[mc];
                    const c = moonStartC + mc;
                    if (ch !== " " && c >= 0 && c < COLS) {
                        gridChar[r][c] = ch;
                        gridR[r][c] = 255;
                        gridG[r][c] = 250;
                        gridB[r][c] = 230;
                        gridGlow[r][c] = 2;
                    }
                }
            }

            // ==========================================
            // 3. SKY LANTERNS (โคมลอยยี่เป็ง)
            // ==========================================
            for (let lant of lanterns) {
                const driftX = (lant.x + t * lant.speed * 0.15) % 1.0;
                const driftY = ((lant.y - t * lant.speed * 1.5) % 0.44 + 0.44) % 0.44;
                const lCol = Math.floor(driftX * COLS);
                const lRow = Math.floor(driftY * ROWS);
                const flicker = Math.sin(t * 12 + lant.x * 20) * 0.2 + 0.8;

                for (let lr = 0; lr < lant.lines.length; lr++) {
                    const line = lant.lines[lr];
                    const r = lRow + lr;
                    if (r >= 0 && r < horizonR) {
                        for (let lc = 0; lc < line.length; lc++) {
                            const c = lCol + lc - Math.floor(line.length / 2);
                            if (c >= 0 && c < COLS) {
                                gridChar[r][c] = line[lc];
                                gridR[r][c] = 255;
                                gridG[r][c] = Math.floor(168 * flicker);
                                gridB[r][c] = 45;
                                gridGlow[r][c] = 2;
                            }
                        }
                    }
                }
            }

            // ==========================================
            // 4. DETAILED TEMPLE & HORIZON ARCHITECTURE
            // ==========================================
            function drawGabledTemple(centerCol, baseRow, width, height, tierLevels, winTextArr) {
                for (let tier = 0; tier < tierLevels; tier++) {
                    const tierW = width * (1.0 - tier * 0.25);
                    const tierH = height * (1.0 - tier * 0.15);
                    const tierBase = baseRow - Math.floor(tier * (height * 0.22));

                    for (let dc = -Math.floor(tierW); dc <= Math.floor(tierW); dc++) {
                        const c = centerCol + dc;
                        if (c < 0 || c >= COLS) continue;
                        const prog = Math.sqrt(Math.max(0, 1.0 - (dc / tierW) ** 2));
                        const roofR = tierBase - Math.floor(prog * tierH * 0.55);

                        if (roofR >= 0 && roofR < horizonR) {
                            gridChar[roofR][c] = "%";
                            gridR[roofR][c] = 175; gridG[roofR][c] = 105; gridB[roofR][c] = 40;
                            gridGlow[roofR][c] = 1;
                        }

                        if (Math.abs(dc) === Math.floor(tierW) && roofR - 1 >= 0) {
                            gridChar[roofR - 1][c] = "^";
                            gridR[roofR - 1][c] = 240; gridG[roofR - 1][c] = 160; gridB[roofR - 1][c] = 50;
                            gridGlow[roofR - 1][c] = 1;
                        }
                    }
                }

                if (winTextArr) {
                    for (let win of winTextArr) {
                        const r = win.r;
                        if (r >= 0 && r < horizonR) {
                            for (let i = 0; i < win.text.length; i++) {
                                const c = win.c + i;
                                const ch = win.text[i];
                                if (ch !== " " && c >= 0 && c < COLS) {
                                    gridChar[r][c] = ch;
                                    gridR[r][c] = 255;
                                    gridG[r][c] = 160;
                                    gridB[r][c] = 35;
                                    gridGlow[r][c] = 1;
                                }
                            }
                        }
                    }
                }
            }

            function drawStupaPrang(cCol, baseR, width, height, isMainPrang) {
                for (let dc = -width; dc <= width; dc++) {
                    const c = cCol + dc;
                    if (c < 0 || c >= COLS) continue;
                    const hFactor = (1.0 - Math.abs(dc) / width);
                    const topR = baseR - Math.floor((hFactor ** (isMainPrang ? 1.4 : 1.9)) * height);

                    for (let r = topR; r <= baseR; r++) {
                        if (r < 0 || r >= horizonR) continue;
                        if (r === topR || Math.abs(dc) === width) {
                            gridChar[r][c] = isMainPrang ? "&" : "#";
                            gridR[r][c] = 185; gridG[r][c] = 115; gridB[r][c] = 45;
                            gridGlow[r][c] = 1;
                        }
                    }
                }
                const needleH = Math.floor(height * 0.35);
                for (let nh = 0; nh <= needleH; nh++) {
                    const r = baseR - height - nh;
                    if (r >= 0 && r < horizonR && cCol >= 0 && cCol < COLS) {
                        gridChar[r][cCol] = (nh === needleH) ? "!" : "|";
                        gridR[r][cCol] = 255;
                        gridG[r][cCol] = 210;
                        gridB[r][cCol] = 70;
                        gridGlow[r][cCol] = 2;
                    }
                }
            }

            // Left Grand Royal Temple
            const leftTempleC = Math.floor(COLS * 0.18);
            drawGabledTemple(leftTempleC, horizonR, Math.floor(COLS * 0.12), Math.floor(ROWS * 0.20), 2, [
                { text: "%+  %0  #M  %+  %%  #%  MM", r: horizonR - 3, c: leftTempleC - 13 },
                { text: "%+  %+  %+  %+  %+  %+  ##", r: horizonR - 1, c: leftTempleC - 13 }
            ]);
            drawStupaPrang(Math.floor(COLS * 0.07), horizonR, Math.floor(COLS * 0.05), Math.floor(ROWS * 0.18), false);

            // Right Mountain & Chedi
            const rightMountainC = Math.floor(COLS * 0.88);
            drawStupaPrang(rightMountainC, horizonR, Math.floor(COLS * 0.09), Math.floor(ROWS * 0.30), false);
            drawGabledTemple(Math.floor(COLS * 0.70), horizonR, Math.floor(COLS * 0.08), Math.floor(ROWS * 0.16), 1, [
                { text: "#%  %+  %#", r: horizonR - 2, c: Math.floor(COLS * 0.67) }
            ]);

            // Center Spires & Golden Radial Light
            const spireConfigs = [
                { offset: -7, h: Math.floor(ROWS * 0.14) },
                { offset: -3, h: Math.floor(ROWS * 0.19) },
                { offset:  0, h: Math.floor(ROWS * 0.26) },
                { offset:  3, h: Math.floor(ROWS * 0.20) },
                { offset:  7, h: Math.floor(ROWS * 0.15) }
            ];
            for (let sp of spireConfigs) {
                const sc = centerC + sp.offset;
                if (sc < 0 || sc >= COLS) continue;
                for (let i = 0; i < sp.h; i++) {
                    const r = horizonR - sp.h + i;
                    if (r >= 0 && r < horizonR) {
                        gridChar[r][sc] = (i === sp.h - 1) ? "!" : "|";
                        gridR[r][sc] = 255;
                        gridG[r][sc] = 180 + (i / sp.h) * 65;
                        gridB[r][sc] = 50;
                        gridGlow[r][sc] = 2;
                    }
                }
            }

            // Radial Light behind Krathong
            const blastRadiusC = Math.floor(COLS * 0.18);
            const blastRadiusR = Math.floor(ROWS * 0.14);
            for (let dr = -blastRadiusR; dr <= 2; dr++) {
                const r = horizonR + dr;
                if (r < 0 || r >= ROWS) continue;
                for (let dc = -blastRadiusC; dc <= blastRadiusC; dc++) {
                    const c = centerC + dc;
                    if (c < 0 || c >= COLS) continue;
                    const dNorm = Math.sqrt((dc / blastRadiusC) ** 2 + (dr / blastRadiusR) ** 2);
                    if (dNorm <= 1.0) {
                        const intensity = (1.0 - dNorm) ** 1.5;
                        gridR[r][c] = Math.min(255, gridR[r][c] + 255 * intensity);
                        gridG[r][c] = Math.min(255, gridG[r][c] + 225 * intensity);
                        gridB[r][c] = Math.min(255, gridB[r][c] + 130 * intensity);
                        gridGlow[r][c] = 2;
                    }
                }
            }

            // ==========================================
            // 5. DEEP DARK GREEN WATER (ผิวน้ำสีเขียวเข้ม)
            // ==========================================
            for (let r = horizonR + 1; r < ROWS; r++) {
                const depthProg = (r - horizonR) / (ROWS - horizonR);
                for (let c = 0; c < COLS; c++) {
                    const wave = Math.sin(c * 0.22 + r * 0.65 + t * 2.8);
                    if (wave > 0.42) {
                        gridChar[r][c] = (c + r) % 3 === 0 ? "~" : "-";
                        gridR[r][c] = 7 + 8 * depthProg;
                        gridG[r][c] = 30 + 22 * (1.0 - depthProg);
                        gridB[r][c] = 18 + 14 * (1.0 - depthProg);
                    } else if (wave < -0.60) {
                        gridChar[r][c] = "/";
                        gridR[r][c] = 5;
                        gridG[r][c] = 20;
                        gridB[r][c] = 12;
                    }
                }
            }

            // ==========================================
            // 6. TRUE 3D PROJECTION OF HIGH-DETAIL KRATHONG
            // (ฉายภาพ 3D แท้ๆ มีความลึก โค้งเว้า หนาเป็นรูปทรง ไม่แบน!)
            // ==========================================
            const autoRotY = t * 0.35; // Slow gentle continuous 3D rotation
            const bobY = Math.sin(t * 2.2) * 0.05; // Floating bobbing on water
            const camPitch = 0.44; // Viewing angle looking down (~25 degrees) to see 3D bowl shape
            const camDist = 4.3;
            const fov = Math.min(COLS * CHAR_W, ROWS * CHAR_H) * 0.95;

            // Character mapping by material & luminance
            const projected3D = [];

            for (let i = 0; i < krathong3DPoints.length; i++) {
                const p = krathong3DPoints[i];
                const col = krathong3DColors[i];
                const mat = krathong3DTypes[i];

                // 1. Rotate around Y (Azimuth)
                const cy = Math.cos(autoRotY), sy = Math.sin(autoRotY);
                let x1 = p[0] * cy + p[2] * sy;
                let z1 = -p[0] * sy + p[2] * cy;
                let y1 = p[1] + bobY;

                // 2. Rotate around X (Camera Pitch looking downward)
                const cx = Math.cos(camPitch), sx = Math.sin(camPitch);
                let y2 = y1 * cx - z1 * sx;
                let z2 = y1 * sx + z1 * cx + camDist;

                if (z2 <= 0.2) continue; // Behind camera

                // 3. Perspective screen projection
                const screenX = (x1 / z2) * (fov / CHAR_W) + centerC;
                const screenY = -(y2 / z2) * (fov / CHAR_H) + (ROWS * 0.60);

                const c = Math.floor(screenX);
                const r = Math.floor(screenY);

                if (r >= 0 && r < ROWS && c >= 0 && c < COLS) {
                    const depth = -z2; // Larger depth means nearer to camera
                    if (depth > gridZ[r][c]) {
                        gridZ[r][c] = depth;

                        // Choose detailed ASCII character based on material
                        let ch;
                        let glow = 1;
                        if (mat === 'leaf') {
                            ch = (c + r) % 2 === 0 ? "1" : "0";
                        } else if (mat === 'petal_out') {
                            ch = "@";
                            glow = 2;
                        } else if (mat === 'petal_mid') {
                            ch = "%";
                            glow = 2;
                        } else if (mat === 'petal_in') {
                            ch = "&";
                            glow = 2;
                        } else if (mat === 'flower') {
                            ch = "8";
                            glow = 2;
                        } else if (mat === 'candle') {
                            ch = "1";
                            glow = 1;
                        } else if (mat === 'incense') {
                            ch = "|";
                            glow = (col[0] > 200) ? 2 : 0;
                        } else {
                            ch = "#";
                        }

                        gridChar[r][c] = ch;
                        gridR[r][c] = col[0];
                        gridG[r][c] = col[1];
                        gridB[r][c] = col[2];
                        gridGlow[r][c] = glow;

                        projected3D.push({ r, c, col, z2 });
                    }
                }
            }

            // Dynamic 3D Candle Flame Particles
            for (let f = 0; f < 36; f++) {
                const fPhase = ((t * 2.5 + f * 0.10) % 1.0);
                const fy = 1.05 + bobY + fPhase * 0.48;
                const fr = 0.07 * (1.0 - fPhase);
                const fa = f * 2.4;
                const fx = Math.cos(fa) * fr + Math.sin(t * 16) * 0.02 * fPhase;
                const fz = Math.sin(fa) * fr;

                const cy = Math.cos(autoRotY), sy = Math.sin(autoRotY);
                let x1 = fx * cy + fz * sy;
                let z1 = -fx * sy + fz * cy;
                let y1 = fy;

                const cx = Math.cos(camPitch), sx = Math.sin(camPitch);
                let y2 = y1 * cx - z1 * sx;
                let z2 = y1 * sx + z1 * cx + camDist;

                const c = Math.floor((x1 / z2) * (fov / CHAR_W) + centerC);
                const r = Math.floor(-(y2 / z2) * (fov / CHAR_H) + (ROWS * 0.60));

                if (r >= 0 && r < ROWS && c >= 0 && c < COLS) {
                    let col = fPhase < 0.25 ? [255, 255, 240] : fPhase < 0.65 ? [255, 205, 50] : [255, 90, 20];
                    gridChar[r][c] = fPhase < 0.25 ? "1" : (fPhase < 0.65 ? "|" : "*");
                    gridR[r][c] = col[0];
                    gridG[r][c] = col[1];
                    gridB[r][c] = col[2];
                    gridGlow[r][c] = 2;
                }
            }

            // ==========================================
            // 7. EXPANSIVE 3D WATER REFLECTION
            // (สะท้อนจุด 3D ทั้งหมดลงบนผิวน้ำตามระลอกคลื่น)
            // ==========================================
            const waterLine = Math.floor(ROWS * 0.59);
            for (let i = 0; i < projected3D.length; i += 2) {
                const pt = projected3D[i];
                if (pt.r < waterLine) {
                    const distToWater = waterLine - pt.r;
                    const reflR = waterLine + Math.floor(distToWater * 0.72);
                    if (reflR < ROWS) {
                        const waveShift = Math.floor(Math.sin(pt.c * 0.15 + t * 3.8) * 2.5);
                        const c = pt.c + waveShift;
                        if (c >= 0 && c < COLS && gridZ[reflR][c] < -9000.0) {
                            if ((c + reflR + Math.floor(t * 2)) % 3 !== 0) {
                                const prog = (reflR - waterLine) / (ROWS - waterLine);
                                const decay = (1.0 - prog * 0.75);
                                gridChar[reflR][c] = (reflR + c) % 2 === 0 ? "~" : "=";
                                gridR[reflR][c] = Math.min(255, pt.col[0] * 0.50 * decay + 8);
                                gridG[reflR][c] = Math.min(255, pt.col[1] * 0.60 * decay + 30);
                                gridB[reflR][c] = Math.min(255, pt.col[2] * 0.35 * decay + 18);
                                if (prog < 0.25) gridGlow[reflR][c] = 1;
                            }
                        }
                    }
                }
            }

            // Floating green water patches (111111, &o)
            const patchList = [
                { x: 0.12, y: 0.72, text: "1111" },
                { x: 0.06, y: 0.86, text: "111111" },
                { x: 0.22, y: 0.93, text: "||||" },
                { x: 0.80, y: 0.74, text: "1101" },
                { x: 0.86, y: 0.88, text: "111111" },
                { x: 0.92, y: 0.84, text: "&o" }
            ];
            for (let pt of patchList) {
                const pr = Math.floor(pt.y * ROWS);
                const pc = Math.floor(pt.x * COLS);
                if (pr > horizonR && pr < ROWS) {
                    for (let i = 0; i < pt.text.length; i++) {
                        const c = pc + i;
                        if (c >= 0 && c < COLS) {
                            gridChar[pr][c] = pt.text[i];
                            gridR[pr][c] = 115;
                            gridG[pr][c] = 245;
                            gridB[pr][c] = 90;
                            gridGlow[pr][c] = 1;
                        }
                    }
                }
            }

            // ==========================================
            // 8. TWO-PASS CANVAS RENDERING (BLOOM & CRISP TEXT)
            // ==========================================
            ctx.font = `bold ${FONT_SIZE}px 'Consolas', 'Courier New', monospace`;
            ctx.textBaseline = "top";

            // Pass 1: Luminous Bloom Glow Pass
            for (let r = 0; r < ROWS; r++) {
                const y = r * CHAR_H;
                for (let c = 0; c < COLS; c++) {
                    const glow = gridGlow[r][c];
                    if (glow > 0) {
                        const ch = gridChar[r][c];
                        const x = c * CHAR_W;
                        const red = gridR[r][c];
                        const green = gridG[r][c];
                        const blue = gridB[r][c];

                        ctx.shadowColor = `rgb(${red}, ${green}, ${blue})`;
                        ctx.shadowBlur = (glow === 2) ? 14 : 7;
                        ctx.fillStyle = `rgb(${red}, ${green}, ${blue})`;
                        ctx.fillText(ch, x, y);
                    }
                }
            }

            // Pass 2: Crisp Monospace ASCII Foreground Pass
            ctx.shadowBlur = 0;
            for (let r = 0; r < ROWS; r++) {
                const y = r * CHAR_H;
                for (let c = 0; c < COLS; c++) {
                    const ch = gridChar[r][c];
                    if (ch !== " ") {
                        const x = c * CHAR_W;
                        const red = gridR[r][c];
                        const green = gridG[r][c];
                        const blue = gridB[r][c];
                        ctx.fillStyle = `rgb(${red}, ${green}, ${blue})`;
                        ctx.fillText(ch, x, y);
                    }
                }
            }

            requestAnimationFrame(render);
        }

        render();
    </script>
</body>
</html>
