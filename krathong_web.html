<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loy Krathong 3D ASCII - เทศกาลลอยกระทง</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            background-color: #030712;
            color: #e2e8f0;
            font-family: 'Consolas', 'Courier New', monospace;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
        }
        #canvas-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .ui-overlay {
            position: absolute;
            top: 24px;
            left: 28px;
            pointer-events: none;
            z-index: 10;
        }
        .ui-overlay h1 {
            font-size: 24px;
            font-weight: 700;
            color: #ffd166;
            text-shadow: 0 0 15px rgba(255, 209, 102, 0.6);
            letter-spacing: 2px;
        }
        .ui-overlay p {
            font-size: 13px;
            color: #7dd3fc;
            margin-top: 4px;
            text-shadow: 0 0 8px rgba(56, 189, 248, 0.4);
        }
        .hud-controls {
            position: absolute;
            bottom: 24px;
            display: flex;
            gap: 12px;
            align-items: center;
            background: rgba(10, 20, 40, 0.75);
            backdrop-filter: blur(8px);
            padding: 10px 20px;
            border-radius: 30px;
            border: 1px solid rgba(56, 189, 248, 0.25);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            font-size: 13px;
            color: #94a3b8;
            z-index: 10;
        }
        .hud-controls span {
            color: #38bdf8;
            font-weight: bold;
        }
        .btn-toggle {
            background: #0284c7;
            color: #fff;
            border: none;
            border-radius: 16px;
            padding: 6px 14px;
            cursor: pointer;
            font-family: inherit;
            font-size: 12px;
            font-weight: bold;
            transition: all 0.2s;
        }
        .btn-toggle:hover {
            background: #0ea5e9;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.6);
        }
    </style>
</head>
<body>
    <div id="canvas-wrapper">
        <div class="ui-overlay">
            <h1>🪷 LOY KRATHONG 3D</h1>
            <p>Mathematical Particle &amp; ASCII Digital Art</p>
        </div>
        
        <canvas id="viewCanvas"></canvas>

        <div class="hud-controls">
            <div>🖱️ <span>คลิกลาก:</span> หมุนมุมมอง 360°</div>
            <div>|</div>
            <div>📜 <span>Scroll:</span> ซูมเข้า-ออก</div>
            <div>|</div>
            <button id="toggleRotBtn" class="btn-toggle">หยุดหมุนอัตโนมัติ</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('viewCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Mathematical Model Generation
        const points = [];
        const colors = [];
        const codeChars = "01*#+~:=·";

        function mix(c1, c2, t) {
            t = Math.max(0, Math.min(1, t));
            return [
                c1[0] * (1 - t) + c2[0] * t,
                c1[1] * (1 - t) + c2[1] * t,
                c1[2] * (1 - t) + c2[2] * t
            ];
        }

        function buildPetal(a, op, ln, wd, y0, r0, isLeaf) {
            const uSteps = 16;
            const vSteps = 10;
            for (let i = 0; i < uSteps; i++) {
                const u = 0.02 + (i / (uSteps - 1)) * 0.98;
                for (let j = 0; j < vSteps; j++) {
                    const v = (j / (vSteps - 1)) * 2.0 - 1.0;
                    const sinVal = Math.sin(Math.PI * Math.pow(Math.min(1, Math.max(0, u)), 0.75));
                    const w = wd * Math.pow(Math.max(0, sinVal), 0.8) + 0.004;
                    const ly = u * ln;
                    const zl = 0.5 * wd * (1.0 - v * v) * (1.0 - 0.5 * u);

                    const y = ly * Math.cos(op) - zl * Math.sin(op);
                    const z = r0 + ly * Math.sin(op) + zl * Math.cos(op);
                    const x = v * w;

                    // Rotate around Y axis by angle 'a'
                    const c = Math.cos(a), s = Math.sin(a);
                    const xr = x * c + z * s;
                    const zr = -x * s + z * c;
                    const yr = y + y0;

                    let col;
                    if (isLeaf) {
                        col = mix([35, 115, 30], [140, 195, 45], u);
                        const edge = 0.3 * Math.pow(Math.abs(v), 4);
                        col = mix(col, [180, 220, 80], edge);
                    } else {
                        // Lotus petal: soft pink gradient
                        col = mix([255, 225, 240], [255, 95, 185], Math.pow(u, 1.3));
                    }

                    points.push([xr, yr, zr]);
                    colors.push(col);
                }
            }
        }

        // Base disc (Banana trunk)
        for (let r = 0.2; r <= 1.3; r += 0.14) {
            for (let a = 0; a < Math.PI * 2; a += Math.PI / 14) {
                const x = r * Math.cos(a);
                const z = r * Math.sin(a);
                points.push([x, -0.10, z]);
                colors.push([45, 100, 32]);
                points.push([x, -0.22, z]);
                colors.push([32, 75, 22]);
            }
        }

        // Petal Layers
        for (let i = 0; i < 14; i++) buildPetal((i / 14) * Math.PI * 2, 1.35, 1.35, 0.45, -0.12, 0.85, true);
        for (let i = 0; i < 12; i++) buildPetal(((i + 0.5) / 12) * Math.PI * 2, 1.05, 1.20, 0.42, -0.05, 0.68, false);
        for (let i = 0; i < 10; i++) buildPetal((i / 10) * Math.PI * 2, 0.70, 1.05, 0.38, 0.02, 0.48, false);
        for (let i = 0; i < 8; i++) buildPetal(((i + 0.5) / 8) * Math.PI * 2, 0.35, 0.90, 0.32, 0.06, 0.28, false);

        // Candle
        for (let h = 0; h <= 0.95; h += 0.08) {
            for (let a = 0; a < Math.PI * 2; a += Math.PI / 5) {
                points.push([0.09 * Math.cos(a), h, 0.09 * Math.sin(a)]);
                colors.push([255, 245, 190]);
            }
        }

        // Stars generator
        const stars = [];
        for (let s = 0; s < 120; s++) {
            stars.push({
                x: Math.random(),
                y: Math.random() * 0.55,
                size: Math.random() * 1.5 + 0.5,
                blinkSpeed: Math.random() * 3 + 1,
                char: Math.random() > 0.4 ? '·' : '*'
            });
        }

        // Camera & User Controls
        let userRotX = 0.45;
        let userRotY = 0;
        let autoRotate = true;
        let zoom = 1.0;
        let isDragging = false;
        let lastMouseX = 0, lastMouseY = 0;

        document.getElementById('toggleRotBtn').addEventListener('click', () => {
            autoRotate = !autoRotate;
            document.getElementById('toggleRotBtn').innerText = autoRotate ? "หยุดหมุนอัตโนมัติ" : "เริ่มหมุนอัตโนมัติ";
        });

        window.addEventListener('mousedown', (e) => {
            if (e.target.tagName === 'BUTTON') return;
            isDragging = true;
            lastMouseX = e.clientX;
            lastMouseY = e.clientY;
        });
        window.addEventListener('mouseup', () => isDragging = false);
        window.addEventListener('mousemove', (e) => {
            if (isDragging) {
                userRotY += (e.clientX - lastMouseX) * 0.007;
                userRotX += (e.clientY - lastMouseY) * 0.007;
                userRotX = Math.max(0.12, Math.min(1.25, userRotX));
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
            }
        });
        window.addEventListener('wheel', (e) => {
            zoom *= e.deltaY > 0 ? 0.92 : 1.08;
            zoom = Math.max(0.5, Math.min(2.2, zoom));
        });

        const startTime = Date.now();

        function render() {
            const t = (Date.now() - startTime) * 0.001;
            const w = canvas.width;
            const h = canvas.height;
            const waterLine = h * 0.62;

            // 1. NIGHT SKY BACKGROUND (ท้องฟ้ากลางคืนไล่เฉดสีลึก)
            const skyGrad = ctx.createLinearGradient(0, 0, 0, waterLine);
            skyGrad.addColorStop(0, '#030712');      // ยอดฟ้ามืดสนิท
            skyGrad.addColorStop(0.5, '#07162c');    // กึ่งกลางฟ้าสีกรมท่า
            skyGrad.addColorStop(1, '#0e2b4f');      // ขอบฟ้าเหนือผิวน้ำ
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, w, waterLine);

            // 2. BLUE WATER BACKGROUND (ผิวน้ำสีฟ้าเปล่งประกาย)
            const waterGrad = ctx.createLinearGradient(0, waterLine, 0, h);
            waterGrad.addColorStop(0, '#0a3663');     // ผิวน้ำชั้นบนสีฟ้าครามลึก
            waterGrad.addColorStop(0.35, '#074780');  // ผิวน้ำสะท้อนแสงสีฟ้าสด
            waterGrad.addColorStop(0.7, '#04284d');   // สีฟ้าเข้ม
            waterGrad.addColorStop(1, '#02152b');     // ด้านล่างสุด
            ctx.fillStyle = waterGrad;
            ctx.fillRect(0, waterLine, w, h - waterLine);

            // Water Horizon Glow line (เส้นขอบน้ำเรืองแสง)
            ctx.strokeStyle = 'rgba(56, 189, 248, 0.25)';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(0, waterLine);
            ctx.lineTo(w, waterLine);
            ctx.stroke();

            // 3. BACKGROUND STARS (ดวงดาวกระพริบบนท้องฟ้า)
            ctx.font = '10px monospace';
            for (let s of stars) {
                const alpha = (Math.sin(t * s.blinkSpeed) * 0.4 + 0.6);
                ctx.fillStyle = `rgba(224, 242, 254, ${alpha})`;
                ctx.fillText(s.char, s.x * w, s.y * waterLine);
            }

            // 4. FULL MOON (พระจันทร์วันเพ็ญสีทองสว่างเรืองแสง)
            const moonX = w * 0.80;
            const moonY = h * 0.20;
            const moonR = Math.min(w, h) * 0.09;

            // Halo glow
            const moonAura = ctx.createRadialGradient(moonX, moonY, moonR * 0.3, moonX, moonY, moonR * 2.8);
            moonAura.addColorStop(0, 'rgba(254, 243, 199, 0.85)');
            moonAura.addColorStop(0.35, 'rgba(253, 224, 71, 0.35)');
            moonAura.addColorStop(0.7, 'rgba(56, 189, 248, 0.15)'); // แสงจันทร์กระทบหมอกสีฟ้า
            moonAura.addColorStop(1, 'rgba(56, 189, 248, 0)');
            ctx.fillStyle = moonAura;
            ctx.beginPath();
            ctx.arc(moonX, moonY, moonR * 2.8, 0, Math.PI * 2);
            ctx.fill();

            // Moon ASCII Matrix Body
            ctx.font = '11px monospace';
            ctx.fillStyle = '#fef08a';
            for (let my = -moonR; my <= moonR; my += 14) {
                for (let mx = -moonR; mx <= moonR; mx += 10) {
                    if (mx * mx + my * my <= moonR * moonR) {
                        const char = codeChars[(Math.floor((mx + my + t * 4)) % codeChars.length + codeChars.length) % codeChars.length];
                        ctx.fillText(char, moonX + mx, moonY + my);
                    }
                }
            }

            // Moonlight reflection on blue water (แสงจันทร์ตกกระทบน้ำ)
            for (let wy = waterLine + 5; wy < h; wy += 12) {
                const waveProg = (wy - waterLine) / (h - waterLine);
                const spread = waveProg * 120 + 20;
                const waveOffset = Math.sin(wy * 0.2 + t * 3.5) * 15;
                const rx = moonX + waveOffset + (Math.random() - 0.5) * spread;
                const char = Math.random() > 0.5 ? '~' : '=';
                ctx.fillStyle = `rgba(253, 224, 71, ${0.45 * (1.0 - waveProg)})`;
                ctx.fillText(char, rx, wy);
            }

            // 5. FLOATING LANTERNS (โคมลอยลอยสู่ฟ้า)
            for (let i = 0; i < 7; i++) {
                const lx = (Math.sin(i * 1.8 + t * 0.1) * 0.35 + 0.35 + i * 0.12) * w;
                const ly = ((waterLine * 0.9 - (t * 22 + i * 85)) % (waterLine * 0.9) + (waterLine * 0.9)) % (waterLine * 0.9);
                ctx.fillStyle = 'rgba(251, 146, 60, 0.9)';
                ctx.fillText('▲', lx, ly);
            }

            // 6. RENDER 3D KRATHONG
            if (autoRotate) userRotY += 0.006;
            const bobY = Math.sin(t * 2.2) * 0.06;
            const camPitch = userRotX;
            const camDist = 4.2 / zoom;
            const fov = Math.min(w, h) * 1.15;

            const projPoints = [];

            // Project krathong points
            for (let i = 0; i < points.length; i++) {
                const p = points[i];
                // Y rotation
                const cy = Math.cos(userRotY), sy = Math.sin(userRotY);
                let x1 = p[0] * cy + p[2] * sy;
                let z1 = -p[0] * sy + p[2] * cy;
                let y1 = p[1] + bobY;

                // X rotation (Camera pitch)
                const cx = Math.cos(camPitch), sx = Math.sin(camPitch);
                let y2 = y1 * cx - z1 * sx;
                let z2 = y1 * sx + z1 * cx + camDist;

                const sxScreen = (x1 / z2) * fov + w * 0.5;
                const syScreen = -(y2 / z2) * fov + h * 0.62;

                projPoints.push({
                    x: sxScreen,
                    y: syScreen,
                    z: z2,
                    col: colors[i]
                });
            }

            // Candle flame particles
            for (let f = 0; f < 32; f++) {
                const fPhase = ((t * 2.5 + f * 0.11) % 1.0);
                const fy = 0.95 + bobY + fPhase * 0.45;
                const fr = 0.06 * (1.0 - fPhase);
                const fa = f * 2.4;
                let fx = Math.cos(fa) * fr + Math.sin(t * 16) * 0.02 * fPhase;
                let fz = Math.sin(fa) * fr;

                const cy = Math.cos(userRotY), sy = Math.sin(userRotY);
                let x1 = fx * cy + fz * sy;
                let z1 = -fx * sy + fz * cy;
                let y1 = fy;

                const cx = Math.cos(camPitch), sx = Math.sin(camPitch);
                let y2 = y1 * cx - z1 * sx;
                let z2 = y1 * sx + z1 * cx + camDist;

                const sxScreen = (x1 / z2) * fov + w * 0.5;
                const syScreen = -(y2 / z2) * fov + h * 0.62;

                let col = fPhase < 0.25 ? [255, 255, 250] : fPhase < 0.65 ? [255, 200, 50] : [255, 70, 20];
                projPoints.push({ x: sxScreen, y: syScreen, z: z2, col: col, isFlame: true });
            }

            // Sort points by depth
            projPoints.sort((a, b) => b.z - a.z);

            // Draw Krathong Characters & Blue Water Ripples
            ctx.font = '11px monospace';

            // Background Blue Water Ripples
            for (let yw = waterLine + 10; yw < h; yw += 16) {
                const waveProg = (yw - waterLine) / (h - waterLine);
                for (let xw = (yw * 7) % 30; xw < w; xw += 35) {
                    const waveAnim = Math.sin(xw * 0.05 + yw * 0.1 + t * 4);
                    if (waveAnim > 0.3) {
                        const waveChar = waveAnim > 0.8 ? '≈' : '~';
                        // Glowing cyan/sky blue ripples
                        ctx.fillStyle = `rgba(56, 189, 248, ${0.35 * (1.0 - waveProg * 0.5)})`;
                        ctx.fillText(waveChar, xw, yw);
                    }
                }
            }

            // Render Krathong points
            for (let i = 0; i < projPoints.length; i++) {
                const pt = projPoints[i];
                if (pt.x >= 0 && pt.x < w && pt.y >= 0 && pt.y < h) {
                    const c = pt.col;
                    ctx.fillStyle = `rgb(${c[0]}, ${c[1]}, ${c[2]})`;
                    const char = pt.isFlame ? '*' : codeChars[(i + Math.floor(t * 8)) % codeChars.length];
                    ctx.fillText(char, pt.x, pt.y);

                    // REFLECTION ON BLUE WATER (แสงสะท้อนบนผิวน้ำสีฟ้า)
                    if (pt.y < waterLine) {
                        const distToWater = waterLine - pt.y;
                        const reflY = waterLine + distToWater * 0.72;
                        if (reflY < h) {
                            const waveShift = Math.sin(pt.x * 0.08 + t * 4.5) * 10;
                            // ผสมสีของกระทงกับสีฟ้าของผิวน้ำ
                            ctx.fillStyle = `rgba(${Math.min(255, c[0] * 0.7)}, ${Math.min(255, c[1] * 0.7 + 60)}, ${Math.min(255, c[2] * 0.8 + 120)}, 0.28)`;
                            ctx.fillText('~', pt.x + waveShift, reflY);
                        }
                    }
                }
            }

            requestAnimationFrame(render);
        }

        render();
    </script>
</body>
</html>
