<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loy Krathong 16:9 ASCII Artwork</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000000;
        }
        body, html {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000000;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
    <canvas id="asciiCanvas"></canvas>

    <script>
        const canvas = document.getElementById('asciiCanvas');
        const ctx = canvas.getContext('2d');

        // High-density character grid resolution
        const FONT_SIZE = 12;
        const CHAR_W = 7.2;
        const CHAR_H = 12.0;

        let COLS = 0;
        let ROWS = 0;

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            COLS = Math.floor(canvas.width / CHAR_W);
            ROWS = Math.floor(canvas.height / CHAR_H);
        }

        // =========================================================
        // 1. COMPACT 3D MATHEMATICAL PARAMETRIC KRATHONG MODEL
        // (กระทง 3D แท้ๆ ขนาดกะทัดรัด ลอยสง่างามในแม่น้ำ)
        // =========================================================
        const krathong3DPoints = [];
        const krathong3DColors = [];
        const krathong3DTypes  = [];

        function mix(c1, c2, t) {
            t = Math.max(0, Math.min(1, t));
            return [
                c1[0] * (1 - t) + c2[0] * t,
                c1[1] * (1 - t) + c2[1] * t,
                c1[2] * (1 - t) + c2[2] * t
            ];
        }

        function build3DPetal(a, op, ln, wd, y0, r0, type) {
            const uSteps = 18;
            const vSteps = 9;
            const scale = 0.55; // ขนาดกะทัดรัด สัดส่วนพอดีกับฉากหลัง

            ln *= scale;
            wd *= scale;
            y0 *= scale;
            r0 *= scale;

            for (let i = 0; i < uSteps; i++) {
                const u = 0.02 + (i / (uSteps - 1)) * 0.98;
                for (let j = 0; j < vSteps; j++) {
                    const v = (j / (vSteps - 1)) * 2.0 - 1.0;

                    const sinVal = Math.sin(Math.PI * Math.pow(Math.min(1, Math.max(0, u)), 0.75));
                    const w = wd * Math.pow(Math.max(0, sinVal), 0.8) + 0.003;
                    const ly = u * ln;
                    const zl = 0.55 * wd * (1.0 - v * v) * (1.0 - 0.45 * u);

                    const y = ly * Math.cos(op) - zl * Math.sin(op);
                    const z = r0 + ly * Math.sin(op) + zl * Math.cos(op);
                    const x = v * w;

                    const cosA = Math.cos(a), sinA = Math.sin(a);
                    const xr = x * cosA + z * sinA;
                    const zr = -x * sinA + z * cosA;
                    const yr = y + y0;

                    let col;
                    if (type === 'leaf') {
                        const baseCol = mix([40, 130, 25], [150, 225, 45], u);
                        const edge = 0.35 * Math.pow(Math.abs(v), 4);
                        col = mix(baseCol, [195, 240, 75], edge);
                    } else if (type === 'petal_out') {
                        col = mix([255, 185, 215], [245, 55, 140], Math.pow(u, 1.2));
                    } else if (type === 'petal_mid') {
                        col = mix([255, 230, 245], [255, 105, 180], Math.pow(u, 1.3));
                    } else if (type === 'petal_in') {
                        col = mix([255, 248, 220], [255, 160, 200], Math.pow(u, 1.4));
                    } else if (type === 'flower') {
                        col = mix([255, 215, 50], [255, 140, 20], u);
                    }

                    krathong3DPoints.push([xr, yr, zr]);
                    krathong3DColors.push(col);
                    krathong3DTypes.push(type);
                }
            }
        }

        function initKrathongModel() {
            krathong3DPoints.length = 0;
            krathong3DColors.length = 0;
            krathong3DTypes.length = 0;

            const scale = 0.55;

            // 1. Layer 1: Outermost Banana Leaves
            for (let i = 0; i < 18; i++) {
                const ang = (i / 18) * Math.PI * 2;
                build3DPetal(ang, 1.38, 1.45, 0.48, -0.15, 0.95, 'leaf');
            }

            // 2. Layer 2: Outermost Lotus Petals
            for (let i = 0; i < 16; i++) {
                const ang = ((i + 0.5) / 16) * Math.PI * 2;
                build3DPetal(ang, 1.10, 1.32, 0.44, -0.08, 0.78, 'petal_out');
            }

            // 3. Layer 3: Middle Lotus Petals
            for (let i = 0; i < 14; i++) {
                const ang = (i / 14) * Math.PI * 2;
                build3DPetal(ang, 0.78, 1.18, 0.40, -0.02, 0.58, 'petal_mid');
            }

            // 4. Layer 4: Inner Lotus Petals
            for (let i = 0; i < 12; i++) {
                const ang = ((i + 0.5) / 12) * Math.PI * 2;
                build3DPetal(ang, 0.42, 1.02, 0.35, 0.04, 0.38, 'petal_in');
            }

            // 5. Layer 5: Marigold Flower Ring
            for (let i = 0; i < 10; i++) {
                const ang = (i / 10) * Math.PI * 2;
                build3DPetal(ang, 0.22, 0.70, 0.28, 0.08, 0.22, 'flower');
            }

            // 6. Base Disc
            for (let r = 0.20 * scale; r <= 1.40 * scale; r += 0.12 * scale) {
                for (let a = 0; a < Math.PI * 2; a += Math.PI / 16) {
                    const x = r * Math.cos(a);
                    const z = r * Math.sin(a);
                    krathong3DPoints.push([x, -0.12 * scale, z]);
                    krathong3DColors.push([45, 105, 30]);
                    krathong3DTypes.push('base');

                    krathong3DPoints.push([x, -0.22 * scale, z]);
                    krathong3DColors.push([32, 75, 20]);
                    krathong3DTypes.push('base');
                }
            }

            // 7. 3D Candle Cylinder
            for (let h = 0.05 * scale; h <= 1.05 * scale; h += 0.07 * scale) {
                for (let a = 0; a < Math.PI * 2; a += Math.PI / 6) {
                    const rCandle = 0.085 * scale;
                    krathong3DPoints.push([rCandle * Math.cos(a), h, rCandle * Math.sin(a)]);
                    krathong3DColors.push([255, 245, 195]);
                    krathong3DTypes.push('candle');
                }
            }

            // 8. 3 Incense Sticks
            const incenseAngles = [-0.18, 0.0, 0.18];
            for (let idx = 0; idx < 3; idx++) {
                const tilt = incenseAngles[idx];
                for (let h = 0.05 * scale; h <= 1.50 * scale; h += 0.08 * scale) {
                    const xi = (idx - 1) * 0.07 * scale + Math.sin(tilt) * h;
                    const zi = 0.06 * scale + Math.cos(tilt) * 0.02 * scale;
                    const isTip = (h >= 1.40 * scale);
                    krathong3DPoints.push([xi, h, zi]);
                    krathong3DColors.push(isTip ? [255, 130, 40] : [160, 80, 45]);
                    krathong3DTypes.push('incense');
                }
            }
        }
        initKrathongModel();

        // =========================================================
        // 2. EXACT BACKGROUND RECREATION (จากรูปภาพที่ผู้ใช้ให้มา)
        // =========================================================

        // Moon Template from User Image
        const exactMoonLines = [
            "      #0000666..     ",
            "   +06#000000&000    ",
            "  006#0000+08#60000  ",
            " 00000&600066000000  ",
            " 000000#000000660    ",
            " 000000#000000000    ",
            " &0000600*60000      ",
            "  000060000000       ",
            "   000600000         ",
            "    &006000          "
        ];

        // 4 Floating Sky Lanterns (ตรงตามตำแหน่งและตัวอักษรในรูปเป๊ะๆ)
        const exactLanterns = [
            // 1. ซ้ายบน
            { relX: 0.155, relY: 0.38, lines: ["7&8#", "#0#", "#8*:"], speed: 0.012, seed: 1.1 },
            // 2. ซ้ายล่าง
            { relX: 0.275, relY: 0.58, lines: ["488", "#@0#", "1&66"], speed: 0.014, seed: 2.3 },
            // 3. กลางบนสุด
            { relX: 0.505, relY: 0.22, lines: ["100#-", "%&0#1-", "&4B"], speed: 0.010, seed: 3.5 },
            // 4. ขวากลาง (ข้างดวงจันทร์)
            { relX: 0.628, relY: 0.44, lines: ["33", "&4&#", "%&0#", "7#"], speed: 0.013, seed: 4.7 }
        ];

        // Stars from image
        const fixedStarCoords = [
            [0.05, 0.12, "+"], [0.09, 0.22, "*"], [0.14, 0.08, "·"], [0.18, 0.28, "o"],
            [0.22, 0.15, "+"], [0.25, 0.42, "·"], [0.33, 0.18, "D"], [0.36, 0.12, "+"],
            [0.39, 0.32, "·"], [0.44, 0.25, "+"], [0.48, 0.15, "*"], [0.55, 0.28, "·"],
            [0.58, 0.12, "+"], [0.65, 0.16, "·"], [0.68, 0.28, "+"], [0.71, 0.08, "*"],
            [0.85, 0.10, "+"], [0.91, 0.20, "·"], [0.95, 0.15, "*"], [0.97, 0.35, "+"],
            [0.03, 0.35, "·"], [0.83, 0.42, "·"], [0.88, 0.38, "o"]
        ];

        window.addEventListener('resize', resize);
        resize();

        const startTime = Date.now();

        function render() {
            const t = (Date.now() - startTime) * 0.001;

            ctx.fillStyle = "#000000";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const gridChar = new Array(ROWS);
            const gridR = new Array(ROWS);
            const gridG = new Array(ROWS);
            const gridB = new Array(ROWS);
            const gridGlow = new Array(ROWS);
            const gridZ = new Array(ROWS);

            for (let r = 0; r < ROWS; r++) {
                gridChar[r] = new Array(COLS).fill(" ");
                gridR[r] = new Float32Array(COLS);
                gridG[r] = new Float32Array(COLS);
                gridB[r] = new Float32Array(COLS);
                gridGlow[r] = new Uint8Array(COLS);
                gridZ[r] = new Float32Array(COLS).fill(-99999.0);
            }

            const horizonR = Math.floor(ROWS * 0.54);
            const centerC = Math.floor(COLS * 0.50);

            // ==========================================
            // 1. SKY & STARS (ตรงตามรูปภาพ)
            // ==========================================
            for (let s of fixedStarCoords) {
                const sc = Math.floor(s[0] * COLS);
                const sr = Math.floor(s[1] * ROWS);
                if (sr < horizonR && sc >= 0 && sc < COLS) {
                    const shimmer = Math.sin(t * 2.2 + sc) * 0.5 + 0.5;
                    gridChar[sr][sc] = s[2];
                    const bright = 180 + shimmer * 75;
                    gridR[sr][sc] = bright;
                    gridG[sr][sc] = bright;
                    gridB[sr][sc] = Math.min(255, bright + 20);
                    if (shimmer > 0.8) gridGlow[sr][sc] = 1;
                }
            }

            // ==========================================
            // 2. THE MOON (ตรงตามรูปภาพ: 0, 6, #, &, @, +, . พร้อมรัศมีเรืองแสง)
            // ==========================================
            const moonCenterC = Math.floor(COLS * 0.77);
            const moonCenterR = Math.floor(ROWS * 0.28);
            const moonHalfW = Math.floor(exactMoonLines[0].length / 2);
            const moonHalfH = Math.floor(exactMoonLines.length / 2);
            const moonStartC = moonCenterC - moonHalfW;
            const moonStartR = moonCenterR - moonHalfH;

            // Halo glow around the moon
            for (let dr = -moonHalfH - 7; dr <= moonHalfH + 10; dr++) {
                const r = moonCenterR + dr;
                if (r < 0 || r >= horizonR) continue;
                for (let dc = -moonHalfW - 12; dc <= moonHalfW + 15; dc++) {
                    const c = moonCenterC + dc;
                    if (c < 0 || c >= COLS) continue;
                    const dNorm = Math.sqrt((dc / (moonHalfW + 8)) ** 2 + (dr / (moonHalfH + 5)) ** 2);
                    if (dNorm > 0.90 && dNorm <= 1.80) {
                        const aura = (1.0 - (dNorm - 0.90) / 0.90);
                        if (Math.random() < aura * 0.40) {
                            gridChar[r][c] = (dr + dc) % 2 === 0 ? "·" : "+";
                            gridR[r][c] = 230 * aura;
                            gridG[r][c] = 215 * aura;
                            gridB[r][c] = 180 * aura;
                            gridGlow[r][c] = 1;
                        }
                    }
                }
            }

            // Moon Solid Body
            for (let mr = 0; mr < exactMoonLines.length; mr++) {
                const line = exactMoonLines[mr];
                const r = moonStartR + mr;
                if (r < 0 || r >= horizonR) continue;
                for (let mc = 0; mc < line.length; mc++) {
                    const ch = line[mc];
                    const c = moonStartC + mc;
                    if (ch !== " " && c >= 0 && c < COLS) {
                        gridChar[r][c] = ch;
                        gridR[r][c] = 255;
                        gridG[r][c] = 250;
                        gridB[r][c] = 230;
                        gridGlow[r][c] = 2; // Intense bloom
                    }
                }
            }

            // Small trailing dot below moon as seen in image
            if (moonCenterR + moonHalfH + 2 < horizonR && moonCenterC < COLS) {
                gridChar[moonCenterR + moonHalfH + 2][moonCenterC] = "0";
                gridR[moonCenterR + moonHalfH + 2][moonCenterC] = 240;
                gridG[moonCenterR + moonHalfH + 2][moonCenterC] = 220;
                gridB[moonCenterR + moonHalfH + 2][moonCenterC] = 190;
                gridGlow[moonCenterR + moonHalfH + 2][moonCenterC] = 1;
            }

            // ==========================================
            // 3. 4 FLOATING ORANGE LANTERNS (ตรงตามรูปภาพเป๊ะๆ)
            // ==========================================
            for (let lant of exactLanterns) {
                const lCol = Math.floor(lant.relX * COLS);
                const lRow = Math.floor(lant.relY * ROWS);
                const flicker = Math.sin(t * 12 + lant.seed) * 0.15 + 0.85;

                for (let lr = 0; lr < lant.lines.length; lr++) {
                    const line = lant.lines[lr];
                    const r = lRow + lr;
                    if (r >= 0 && r < horizonR) {
                        for (let lc = 0; lc < line.length; lc++) {
                            const c = lCol + lc - Math.floor(line.length / 2);
                            if (c >= 0 && c < COLS) {
                                gridChar[r][c] = line[lc];
                                gridR[r][c] = 255;
                                gridG[r][c] = Math.floor(168 * flicker);
                                gridB[r][c] = 45;
                                gridGlow[r][c] = 2;
                            }
                        }
                    }
                }
            }

            // ==========================================
            // 4. EXACT HORIZON SKYLINE (LEFT DOME, CENTER SPIRES, RIGHT MOUNTAIN)
            // ==========================================

            // A. LEFT DOME BUILDING WITH 2 ROWS OF WINDOWS (ตรงตามรูปเป๊ะๆ)
            const leftDomeC = Math.floor(COLS * 0.18);
            const leftDomeW = Math.floor(COLS * 0.15);
            const leftDomeH = Math.floor(ROWS * 0.22);
            const domeTopR = horizonR - leftDomeH;

            // Curved Dome Outline with +, =, %, #
            for (let dc = -leftDomeW; dc <= leftDomeW; dc++) {
                const c = leftDomeC + dc;
                if (c < 0 || c >= COLS) continue;
                const normX = Math.abs(dc) / leftDomeW;
                // Flat top with curved steep sides
                const profile = (normX < 0.60) ? 1.0 : Math.sqrt(Math.max(0, 1.0 - ((normX - 0.60) / 0.40) ** 2));
                const topR = horizonR - Math.floor(profile * leftDomeH);

                for (let r = topR; r < horizonR; r++) {
                    if (r === topR || Math.abs(dc) === leftDomeW) {
                        // Golden-orange contour outline
                        gridChar[r][c] = (r === topR && Math.abs(dc) < leftDomeW * 0.5) ? "=" : "%";
                        gridR[r][c] = 195; gridG[r][c] = 115; gridB[r][c] = 40;
                        gridGlow[r][c] = 1;
                    } else if (r < horizonR - 4 && (r % 2 === 0) && (c % 2 === 0)) {
                        // Dark interior shading
                        gridChar[r][c] = ":";
                        gridR[r][c] = 80; gridG[r][c] = 45; gridB[r][c] = 20;
                    }
                }
            }

            // EXACT TWO ROWS OF ILLUMINATED WINDOWS FROM IMAGE:
            // Row 1: %+  %o   #M  #%  %%  #%   MM
            // Row 2: %+  %+   %+  %+  %+  %+   ##
            const winText1 = "%+  %o   #M  #%  %%  #%   MM";
            const winText2 = "%+  %+   %+  %+  %+  %+   ##";
            const winR1 = horizonR - 3;
            const winR2 = horizonR - 1;
            const winStartC = leftDomeC - Math.floor(winText1.length / 2);

            for (let i = 0; i < winText1.length; i++) {
                const c = winStartC + i;
                const ch = winText1[i];
                if (ch !== " " && c >= 0 && c < COLS && winR1 >= 0) {
                    gridChar[winR1][c] = ch;
                    gridR[winR1][c] = 255; gridG[winR1][c] = 175; gridB[winR1][c] = 40;
                    gridGlow[winR1][c] = 1;
                }
            }
            for (let i = 0; i < winText2.length; i++) {
                const c = winStartC + i;
                const ch = winText2[i];
                if (ch !== " " && c >= 0 && c < COLS && winR2 >= 0) {
                    gridChar[winR2][c] = ch;
                    gridR[winR2][c] = 255; gridG[winR2][c] = 175; gridB[winR2][c] = 40;
                    gridGlow[winR2][c] = 1;
                }
            }

            // B. RIGHT TALL TRIANGULAR MOUNTAIN / PAGODA (ตรงตามรูป)
            const rightMountC = Math.floor(COLS * 0.85);
            const rightMountW = Math.floor(COLS * 0.12);
            const rightMountH = Math.floor(ROWS * 0.32);

            for (let dc = -rightMountW; dc <= rightMountW; dc++) {
                const c = rightMountC + dc;
                if (c < 0 || c >= COLS) continue;
                const prog = 1.0 - Math.abs(dc) / rightMountW;
                const topR = horizonR - Math.floor((prog ** 1.8) * rightMountH);

                for (let r = topR; r < horizonR; r++) {
                    if (r === topR || Math.abs(dc) === rightMountW) {
                        gridChar[r][c] = "#";
                        gridR[r][c] = 185; gridG[r][c] = 105; gridB[r][c] = 35;
                        gridGlow[r][c] = 1;
                    } else if ((r % 2 === 0) && (c % 2 === 0)) {
                        gridChar[r][c] = ".";
                        gridR[r][c] = 60; gridG[r][c] = 35; gridB[r][c] = 18;
                    }
                }
            }

            // C. CENTER TALL SPIRES & BLAZING GOLDEN GLOW (ตรงตามรูปเป๊ะๆ)
            // Spires with 11, 1, |
            const centerSpireLines = [
                "        11       ",
                "        11       ",
                "        11       ",
                "   11   11   1   ",
                "   11  #811  1   ",
                "   11  06601 1   ",
                "  1   06606# 11  ",
                " 11  #06606I  1  ",
                "111 0660601  111 "
            ];
            const spireStartR = horizonR - centerSpireLines.length;
            const spireStartC = centerC - Math.floor(centerSpireLines[0].length / 2);

            for (let sr = 0; sr < centerSpireLines.length; sr++) {
                const line = centerSpireLines[sr];
                const r = spireStartR + sr;
                if (r < 0 || r >= horizonR) continue;
                for (let sc = 0; sc < line.length; sc++) {
                    const ch = line[sc];
                    const c = spireStartC + sc;
                    if (ch !== " " && c >= 0 && c < COLS) {
                        gridChar[r][c] = ch;
                        gridR[r][c] = 255;
                        gridG[r][c] = 190 + (sr / centerSpireLines.length) * 55;
                        gridB[r][c] = 50;
                        gridGlow[r][c] = 2; // Brilliant golden glow
                    }
                }
            }

            // Blazing golden explosion of light along horizon in center
            const blastRadiusC = Math.floor(COLS * 0.16);
            const blastRadiusR = Math.floor(ROWS * 0.10);
            for (let dr = -blastRadiusR; dr <= 2; dr++) {
                const r = horizonR + dr;
                if (r < 0 || r >= ROWS) continue;
                for (let dc = -blastRadiusC; dc <= blastRadiusC; dc++) {
                    const c = centerC + dc;
                    if (c < 0 || c >= COLS) continue;
                    const dNorm = Math.sqrt((dc / blastRadiusC) ** 2 + (dr / blastRadiusR) ** 2);
                    if (dNorm <= 1.0) {
                        const intensity = (1.0 - dNorm) ** 1.3;
                        gridR[r][c] = Math.min(255, gridR[r][c] + 255 * intensity);
                        gridG[r][c] = Math.min(255, gridG[r][c] + 225 * intensity);
                        gridB[r][c] = Math.min(255, gridB[r][c] + 130 * intensity);
                        gridGlow[r][c] = 2;
                    }
                }
            }

            // Horizon characters
            for (let c = 0; c < COLS; c++) {
                if (gridChar[horizonR][c] === " ") {
                    gridChar[horizonR][c] = "-";
                    gridR[horizonR][c] = 90; gridG[horizonR][c] = 55; gridB[horizonR][c] = 25;
                }
            }

            // ==========================================
            // 5. DEEP DARK GREEN / TEAL WATER BASE
            // ==========================================
            for (let r = horizonR + 1; r < ROWS; r++) {
                const depthProg = (r - horizonR) / (ROWS - horizonR);
                for (let c = 0; c < COLS; c++) {
                    const wave = Math.sin(c * 0.22 + r * 0.65 + t * 2.8);
                    if (wave > 0.42) {
                        gridChar[r][c] = (c + r) % 3 === 0 ? "~" : "-";
                        gridR[r][c] = 7 + 8 * depthProg;
                        gridG[r][c] = 30 + 22 * (1.0 - depthProg);
                        gridB[r][c] = 18 + 14 * (1.0 - depthProg);
                    } else if (wave < -0.60) {
                        gridChar[r][c] = "/";
                        gridR[r][c] = 5;
                        gridG[r][c] = 20;
                        gridB[r][c] = 12;
                    }
                }
            }

            // ==========================================
            // 6. TRUE 3D PROJECTION OF COMPACT DETAILED KRATHONG
            // (กระทง 3D กะทัดรัดสง่างาม ลอยน้ำอยู่ด้านหน้าฉากนี้)
            // ==========================================
            const autoRotY = t * 0.35;
            const bobY = Math.sin(t * 2.2) * 0.04;
            const camPitch = 0.44;
            const camDist = 4.6;
            const fov = Math.min(COLS * CHAR_W, ROWS * CHAR_H) * 0.82;

            const projected3D = [];

            for (let i = 0; i < krathong3DPoints.length; i++) {
                const p = krathong3DPoints[i];
                const col = krathong3DColors[i];
                const mat = krathong3DTypes[i];

                const cy = Math.cos(autoRotY), sy = Math.sin(autoRotY);
                let x1 = p[0] * cy + p[2] * sy;
                let z1 = -p[0] * sy + p[2] * cy;
                let y1 = p[1] + bobY;

                const cx = Math.cos(camPitch), sx = Math.sin(camPitch);
                let y2 = y1 * cx - z1 * sx;
                let z2 = y1 * sx + z1 * cx + camDist;

                if (z2 <= 0.2) continue;

                const screenX = (x1 / z2) * (fov / CHAR_W) + centerC;
                const screenY = -(y2 / z2) * (fov / CHAR_H) + (ROWS * 0.66);

                const c = Math.floor(screenX);
                const r = Math.floor(screenY);

                if (r >= 0 && r < ROWS && c >= 0 && c < COLS) {
                    const depth = -z2;
                    if (depth > gridZ[r][c]) {
                        gridZ[r][c] = depth;

                        let ch;
                        let glow = 1;
                        if (mat === 'leaf') {
                            ch = (c + r) % 2 === 0 ? "1" : "0";
                        } else if (mat === 'petal_out') {
                            ch = "@";
                            glow = 2;
                        } else if (mat === 'petal_mid') {
                            ch = "%";
                            glow = 2;
                        } else if (mat === 'petal_in') {
                            ch = "&";
                            glow = 2;
                        } else if (mat === 'flower') {
                            ch = "8";
                            glow = 2;
                        } else if (mat === 'candle') {
                            ch = "1";
                            glow = 1;
                        } else if (mat === 'incense') {
                            ch = "|";
                            glow = (col[0] > 200) ? 2 : 0;
                        } else {
                            ch = "#";
                        }

                        gridChar[r][c] = ch;
                        gridR[r][c] = col[0];
                        gridG[r][c] = col[1];
                        gridB[r][c] = col[2];
                        gridGlow[r][c] = glow;

                        projected3D.push({ r, c, col, z2 });
                    }
                }
            }

            // 3D Candle Flame Particles
            const candleTop = 0.75 + bobY;
            for (let f = 0; f < 32; f++) {
                const fPhase = ((t * 2.5 + f * 0.11) % 1.0);
                const fy = candleTop + fPhase * 0.42;
                const fr = 0.055 * (1.0 - fPhase);
                const fa = f * 2.4;
                const fx = Math.cos(fa) * fr + Math.sin(t * 16) * 0.018 * fPhase;
                const fz = Math.sin(fa) * fr;

                const cy = Math.cos(autoRotY), sy = Math.sin(autoRotY);
                let x1 = fx * cy + fz * sy;
                let z1 = -fx * sy + fz * cy;
                let y1 = fy;

                const cx = Math.cos(camPitch), sx = Math.sin(camPitch);
                let y2 = y1 * cx - z1 * sx;
                let z2 = y1 * sx + z1 * cx + camDist;

                const c = Math.floor((x1 / z2) * (fov / CHAR_W) + centerC);
                const r = Math.floor(-(y2 / z2) * (fov / CHAR_H) + (ROWS * 0.66));

                if (r >= 0 && r < ROWS && c >= 0 && c < COLS) {
                    let col = fPhase < 0.25 ? [255, 255, 240] : fPhase < 0.65 ? [255, 205, 50] : [255, 90, 20];
                    gridChar[r][c] = fPhase < 0.25 ? "1" : (fPhase < 0.65 ? "|" : "*");
                    gridR[r][c] = col[0];
                    gridG[r][c] = col[1];
                    gridB[r][c] = col[2];
                    gridGlow[r][c] = 2;
                }
            }

            // ==========================================
            // 7. EXPANSIVE 3D WATER REFLECTION
            // ==========================================
            const waterLine = Math.floor(ROWS * 0.65);
            for (let i = 0; i < projected3D.length; i += 2) {
                const pt = projected3D[i];
                if (pt.r < waterLine) {
                    const distToWater = waterLine - pt.r;
                    const reflR = waterLine + Math.floor(distToWater * 0.72);
                    if (reflR < ROWS) {
                        const waveShift = Math.floor(Math.sin(pt.c * 0.15 + t * 3.8) * 2.2);
                        const c = pt.c + waveShift;
                        if (c >= 0 && c < COLS && gridZ[reflR][c] < -9000.0) {
                            if ((c + reflR + Math.floor(t * 2)) % 3 !== 0) {
                                const prog = (reflR - waterLine) / (ROWS - waterLine);
                                const decay = (1.0 - prog * 0.75);
                                gridChar[reflR][c] = (reflR + c) % 2 === 0 ? "~" : "=";
                                gridR[reflR][c] = Math.min(255, pt.col[0] * 0.50 * decay + 8);
                                gridG[reflR][c] = Math.min(255, pt.col[1] * 0.60 * decay + 30);
                                gridB[reflR][c] = Math.min(255, pt.col[2] * 0.35 * decay + 18);
                                if (prog < 0.25) gridGlow[reflR][c] = 1;
                            }
                        }
                    }
                }
            }

            // Floating green water patches
            const patchList = [
                { x: 0.12, y: 0.74, text: "1111" },
                { x: 0.06, y: 0.88, text: "111111" },
                { x: 0.22, y: 0.94, text: "||||" },
                { x: 0.80, y: 0.76, text: "1101" },
                { x: 0.86, y: 0.90, text: "111111" },
                { x: 0.92, y: 0.86, text: "&o" }
            ];
            for (let pt of patchList) {
                const pr = Math.floor(pt.y * ROWS);
                const pc = Math.floor(pt.x * COLS);
                if (pr > horizonR && pr < ROWS) {
                    for (let i = 0; i < pt.text.length; i++) {
                        const c = pc + i;
                        if (c >= 0 && c < COLS) {
                            gridChar[pr][c] = pt.text[i];
                            gridR[pr][c] = 115;
                            gridG[pr][c] = 245;
                            gridB[pr][c] = 90;
                            gridGlow[pr][c] = 1;
                        }
                    }
                }
            }

            // ==========================================
            // 8. TWO-PASS CANVAS RENDERING (BLOOM & CRISP TEXT)
            // ==========================================
            ctx.font = `bold ${FONT_SIZE}px 'Consolas', 'Courier New', monospace`;
            ctx.textBaseline = "top";

            // Pass 1: Luminous Bloom Glow Pass
            for (let r = 0; r < ROWS; r++) {
                const y = r * CHAR_H;
                for (let c = 0; c < COLS; c++) {
                    const glow = gridGlow[r][c];
                    if (glow > 0) {
                        const ch = gridChar[r][c];
                        const x = c * CHAR_W;
                        const red = gridR[r][c];
                        const green = gridG[r][c];
                        const blue = gridB[r][c];

                        ctx.shadowColor = `rgb(${red}, ${green}, ${blue})`;
                        ctx.shadowBlur = (glow === 2) ? 14 : 7;
                        ctx.fillStyle = `rgb(${red}, ${green}, ${blue})`;
                        ctx.fillText(ch, x, y);
                    }
                }
            }

            // Pass 2: Crisp Monospace ASCII Foreground Pass
            ctx.shadowBlur = 0;
            for (let r = 0; r < ROWS; r++) {
                const y = r * CHAR_H;
                for (let c = 0; c < COLS; c++) {
                    const ch = gridChar[r][c];
                    if (ch !== " ") {
                        const x = c * CHAR_W;
                        const red = gridR[r][c];
                        const green = gridG[r][c];
                        const blue = gridB[r][c];
                        ctx.fillStyle = `rgb(${red}, ${green}, ${blue})`;
                        ctx.fillText(ch, x, y);
                    }
                }
            }

            requestAnimationFrame(render);
        }

        render();
    </script>
</body>
</html>
