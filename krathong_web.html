<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loy Krathong ASCII 3D Animation</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #05070c;
            color: #ecf0f1;
            font-family: 'Consolas', 'Courier New', monospace;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        #canvas-container {
            position: relative;
            box-shadow: 0 0 50px rgba(255, 170, 50, 0.15);
            border-radius: 8px;
            overflow: hidden;
        }
        canvas {
            display: block;
            background: radial-gradient(circle at 75% 20%, #151b2e 0%, #05070c 80%);
        }
        .header-info {
            position: absolute;
            top: 15px;
            left: 20px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.6);
            letter-spacing: 1px;
            text-transform: uppercase;
            pointer-events: none;
        }
        .header-info h1 {
            font-size: 16px;
            color: #ffd166;
            margin-bottom: 4px;
        }
        .controls-hint {
            position: absolute;
            bottom: 15px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.4);
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="canvas-container">
        <div class="header-info">
            <h1>Loy Krathong ASCII 3D</h1>
            <p>Mathematical Particle &amp; ASCII Visualizer</p>
        </div>
        <canvas id="viewCanvas"></canvas>
        <div class="controls-hint">คลิกและลากเมาส์เพื่อหมุนมุมมอง | Click &amp; drag to rotate</div>
    </div>

    <script>
        const canvas = document.getElementById('viewCanvas');
        const ctx = canvas.getContext('2d');

        const width = 850;
        const height = 950;
        canvas.width = width;
        canvas.height = height;

        // Model Generation
        const points = [];
        const colors = [];
        const codeChars = "01*#+~:=·";

        function mix(c1, c2, t) {
            t = Math.max(0, Math.min(1, t));
            return [
                c1[0] * (1 - t) + c2[0] * t,
                c1[1] * (1 - t) + c2[1] * t,
                c1[2] * (1 - t) + c2[2] * t
            ];
        }

        function buildPetal(a, op, ln, wd, y0, r0, isLeaf) {
            const uSteps = 16;
            const vSteps = 10;
            for (let i = 0; i < uSteps; i++) {
                const u = 0.02 + (i / (uSteps - 1)) * 0.98;
                for (let j = 0; j < vSteps; j++) {
                    const v = (j / (vSteps - 1)) * 2.0 - 1.0;
                    const sinVal = Math.sin(Math.PI * Math.pow(Math.min(1, Math.max(0, u)), 0.75));
                    const w = wd * Math.pow(Math.max(0, sinVal), 0.8) + 0.004;
                    const ly = u * ln;
                    const zl = 0.5 * wd * (1.0 - v * v) * (1.0 - 0.5 * u);

                    const y = ly * Math.cos(op) - zl * Math.sin(op);
                    const z = r0 + ly * Math.sin(op) + zl * Math.cos(op);
                    const x = v * w;

                    // Rotate around Y axis by angle 'a'
                    const c = Math.cos(a), s = Math.sin(a);
                    const xr = x * c + z * s;
                    const zr = -x * s + z * c;
                    const yr = y + y0;

                    let col;
                    if (isLeaf) {
                        col = mix([38, 115, 26], [140, 191, 46], u);
                        const edge = 0.3 * Math.pow(Math.abs(v), 4);
                        col = mix(col, [178, 217, 76], edge);
                    } else {
                        col = mix([255, 217, 235], [255, 102, 184], Math.pow(u, 1.3));
                    }

                    points.push([xr, yr, zr]);
                    colors.push(col);
                }
            }
        }

        // Build Base
        for (let r = 0.2; r <= 1.25; r += 0.15) {
            for (let a = 0; a < Math.PI * 2; a += Math.PI / 12) {
                const x = r * Math.cos(a);
                const z = r * Math.sin(a);
                points.push([x, -0.1, z]);
                colors.push([46, 97, 31]);
                points.push([x, -0.22, z]);
                colors.push([36, 71, 20]);
            }
        }

        // Build Layers
        for (let i = 0; i < 14; i++) buildPetal((i / 14) * Math.PI * 2, 1.35, 1.35, 0.45, -0.12, 0.85, true);
        for (let i = 0; i < 12; i++) buildPetal(((i + 0.5) / 12) * Math.PI * 2, 1.05, 1.20, 0.42, -0.05, 0.68, false);
        for (let i = 0; i < 10; i++) buildPetal((i / 10) * Math.PI * 2, 0.70, 1.05, 0.38, 0.02, 0.48, false);
        for (let i = 0; i < 8; i++) buildPetal(((i + 0.5) / 8) * Math.PI * 2, 0.35, 0.90, 0.32, 0.06, 0.28, false);

        // Candle
        for (let h = 0; h <= 0.9; h += 0.08) {
            for (let a = 0; a < Math.PI * 2; a += Math.PI / 4) {
                points.push([0.09 * Math.cos(a), h, 0.09 * Math.sin(a)]);
                colors.push([255, 242, 191]);
            }
        }

        let userRotX = 0.42;
        let userRotY = 0;
        let isDragging = false;
        let lastMouseX = 0, lastMouseY = 0;

        window.addEventListener('mousedown', (e) => {
            isDragging = true;
            lastMouseX = e.clientX;
            lastMouseY = e.clientY;
        });
        window.addEventListener('mouseup', () => isDragging = false);
        window.addEventListener('mousemove', (e) => {
            if (isDragging) {
                userRotY += (e.clientX - lastMouseX) * 0.008;
                userRotX += (e.clientY - lastMouseY) * 0.008;
                userRotX = Math.max(0.1, Math.min(1.2, userRotX));
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
            }
        });

        let startTime = Date.now();

        function render() {
            const t = (Date.now() - startTime) * 0.001;
            ctx.clearRect(0, 0, width, height);

            // 1. Full Moon
            const moonX = width * 0.76;
            const moonY = height * 0.22;
            const moonR = 65;
            const grad = ctx.createRadialGradient(moonX, moonY, moonR * 0.2, moonX, moonY, moonR * 1.8);
            grad.addColorStop(0, 'rgba(255, 245, 200, 0.95)');
            grad.addColorStop(0.5, 'rgba(255, 230, 150, 0.4)');
            grad.addColorStop(1, 'rgba(255, 230, 150, 0)');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(moonX, moonY, moonR * 1.8, 0, Math.PI * 2);
            ctx.fill();

            // Moon Matrix Characters
            ctx.font = '11px monospace';
            ctx.fillStyle = '#fff4ce';
            for (let my = -moonR; my <= moonR; my += 14) {
                for (let mx = -moonR; mx <= moonR; mx += 10) {
                    if (mx * mx + my * my <= moonR * moonR) {
                        const char = codeChars[(Math.floor((mx + my + t * 5)) % codeChars.length + codeChars.length) % codeChars.length];
                        ctx.fillText(char, moonX + mx, moonY + my);
                    }
                }
            }

            // 2. Floating lanterns
            for (let i = 0; i < 6; i++) {
                const lx = (Math.sin(i * 1.7 + t * 0.1) * 0.35 + 0.4 + i * 0.1) * width;
                const ly = ((height * 0.5 - (t * 25 + i * 90)) % (height * 0.5) + height * 0.5) % (height * 0.5);
                ctx.fillStyle = 'rgba(255, 170, 50, 0.85)';
                ctx.fillText('▲', lx, ly);
            }

            // 3. Render 3D Krathong
            const autoRotY = userRotY + t * 0.35;
            const bobY = Math.sin(t * 2.2) * 0.06;
            const camPitch = userRotX;
            const camDist = 4.0;
            const fov = 750;

            const projPoints = [];
            for (let i = 0; i < points.length; i++) {
                const p = points[i];
                // Rotate around Y
                const cy = Math.cos(autoRotY), sy = Math.sin(autoRotY);
                let x1 = p[0] * cy + p[2] * sy;
                let z1 = -p[0] * sy + p[2] * cy;
                let y1 = p[1] + bobY;

                // Rotate around X (Camera pitch)
                const cx = Math.cos(camPitch), sx = Math.sin(camPitch);
                let y2 = y1 * cx - z1 * sx;
                let z2 = y1 * sx + z1 * cx + camDist;

                const sxScreen = (x1 / z2) * fov + width * 0.5;
                const syScreen = -(y2 / z2) * fov + height * 0.65;

                projPoints.push({
                    x: sxScreen,
                    y: syScreen,
                    z: z2,
                    col: colors[i]
                });
            }

            // Candle flame particles
            for (let f = 0; f < 30; f++) {
                const fPhase = ((t * 2.5 + f * 0.12) % 1.0);
                const fy = 0.95 + bobY + fPhase * 0.45;
                const fr = 0.06 * (1.0 - fPhase);
                const fa = f * 2.3;
                let fx = Math.cos(fa) * fr + Math.sin(t * 15) * 0.02 * fPhase;
                let fz = Math.sin(fa) * fr;

                const cy = Math.cos(autoRotY), sy = Math.sin(autoRotY);
                let x1 = fx * cy + fz * sy;
                let z1 = -fx * sy + fz * cy;
                let y1 = fy;

                const cx = Math.cos(camPitch), sx = Math.sin(camPitch);
                let y2 = y1 * cx - z1 * sx;
                let z2 = y1 * sx + z1 * cx + camDist;

                const sxScreen = (x1 / z2) * fov + width * 0.5;
                const syScreen = -(y2 / z2) * fov + height * 0.65;

                let col = fPhase < 0.25 ? [255, 255, 240] : fPhase < 0.65 ? [255, 195, 45] : [255, 75, 15];
                projPoints.push({ x: sxScreen, y: syScreen, z: z2, col: col, isFlame: true });
            }

            // Sort by depth (Painter's algorithm)
            projPoints.sort((a, b) => b.z - a.z);

            ctx.font = '10px monospace';
            for (let i = 0; i < projPoints.length; i++) {
                const pt = projPoints[i];
                if (pt.x >= 0 && pt.x < width && pt.y >= 0 && pt.y < height) {
                    const c = pt.col;
                    ctx.fillStyle = `rgb(${c[0]}, ${c[1]}, ${c[2]})`;
                    const char = pt.isFlame ? '*' : codeChars[(i + Math.floor(t * 10)) % codeChars.length];
                    ctx.fillText(char, pt.x, pt.y);

                    // Water reflection
                    const waterLine = height * 0.68;
                    if (pt.y < waterLine) {
                        const distToWater = waterLine - pt.y;
                        const reflY = waterLine + distToWater * 0.7;
                        if (reflY < height) {
                            const wave = Math.sin(pt.x * 0.05 + t * 4) * 8;
                            ctx.fillStyle = `rgba(${c[0]}, ${c[1]}, ${c[2]}, 0.22)`;
                            ctx.fillText('~', pt.x + wave, reflY);
                        }
                    }
                }
            }

            requestAnimationFrame(render);
        }

        render();
    </script>
</body>
</html>
