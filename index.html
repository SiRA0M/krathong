<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loy Krathong 3D High-Detail ASCII Panorama</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000000;
        }
        body, html {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000000;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
    <canvas id="asciiCanvas" role="img" aria-label="ภาพพาโนรามา ASCII เคลื่อนไหวในเทศกาลลอยกระทง"></canvas>

    <script>
        const canvas = document.getElementById('asciiCanvas');
        const ctx = canvas.getContext('2d');

        // High-density character grid resolution
        const FONT_SIZE = 12;
        const CHAR_W = 7.2;
        const CHAR_H = 12.0;

        let COLS = 0;
        let ROWS = 0;

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            COLS = Math.floor(canvas.width / CHAR_W);
            ROWS = Math.floor(canvas.height / CHAR_H);
            initBackgroundStars();
        }

        // =========================================================
        // 1. ULTRA HIGH-DETAIL 3D MATHEMATICAL LOTUS KRATHONG
        // (กระทงดอกบัว 3 มิติวิจิตรตระการตา กลีบซ้อนชั้น แอ่งลึก แสงเงาสมจริง)
        // =========================================================
        const krathongPoints = [];
        const krathongColors = [];
        const krathongNormals = [];
        const krathongTypes = [];

        function mix(c1, c2, t) {
            t = Math.max(0, Math.min(1, t));
            return [
                c1[0] * (1 - t) + c2[0] * t,
                c1[1] * (1 - t) + c2[1] * t,
                c1[2] * (1 - t) + c2[2] * t
            ];
        }

        // Build individual pointed 3D petal with realistic curved cupping
        function build3DPetal(azimuth, openAngle, length, width, yOffset, radialOffset, type) {
            const uSteps = 20; // High longitudinal resolution
            const vSteps = 12; // High lateral resolution
            const scale = 0.65;

            length *= scale;
            width *= scale;
            yOffset *= scale;
            radialOffset *= scale;

            for (let i = 0; i < uSteps; i++) {
                const u = 0.04 + (i / (uSteps - 1)) * 0.96;
                for (let j = 0; j < vSteps; j++) {
                    const v = (j / (vSteps - 1)) * 2.0 - 1.0;

                    // Pointed lotus petal outline (กลีบเรียวแหลม)
                    const sinTaper = Math.sin(Math.PI * Math.pow(u, 0.75));
                    const w = width * Math.pow(Math.max(0, sinTaper), 0.8) + 0.002;
                    const ly = u * length;

                    // 3D Cupping: arching inward to create natural bowl-like petal
                    const zl = 0.65 * width * (1.0 - v * v) * (1.0 - 0.40 * u);

                    // Opening tilt angle
                    const y = ly * Math.cos(openAngle) - zl * Math.sin(openAngle);
                    const z = radialOffset + ly * Math.sin(openAngle) + zl * Math.cos(openAngle);
                    const x = v * w;

                    // Azimuth rotation around krathong center
                    const cosA = Math.cos(azimuth), sinA = Math.sin(azimuth);
                    const xr = x * cosA + z * sinA;
                    const zr = -x * sinA + z * cosA;
                    const yr = y + yOffset;

                    // Surface normal for lighting
                    const nx = v * cosA;
                    const ny = Math.sin(openAngle);
                    const nz = v * sinA + Math.cos(openAngle);

                    let col;
                    const isEdge = (Math.abs(v) > 0.75 || u > 0.85);

                    if (type === 'leaf') {
                        // Banana leaf folds: rich green with yellow-green tip & edge
                        const baseG = mix([35, 115, 25], [145, 215, 45], u);
                        col = isEdge ? [185, 240, 70] : baseG;
                    } else if (type === 'petal_out') {
                        // Outer lotus petals: deep rose magenta with delicate white edges
                        const baseP = mix([255, 180, 215], [240, 45, 130], Math.pow(u, 1.2));
                        col = isEdge ? [255, 230, 245] : baseP;
                    } else if (type === 'petal_mid') {
                        // Mid lotus petals: vibrant lotus pink
                        const baseP = mix([255, 220, 238], [255, 85, 170], Math.pow(u, 1.3));
                        col = isEdge ? [255, 245, 250] : baseP;
                    } else if (type === 'petal_in') {
                        // Inner lotus petals: soft blushing pink to ivory
                        const baseP = mix([255, 245, 230], [255, 140, 195], Math.pow(u, 1.4));
                        col = isEdge ? [255, 255, 245] : baseP;
                    } else if (type === 'flower') {
                        // Marigold flower petals: golden yellow
                        col = mix([255, 215, 50], [255, 145, 20], u);
                    }

                    krathongPoints.push([xr, yr, zr]);
                    krathongColors.push(col);
                    krathongNormals.push([nx, ny, nz]);
                    krathongTypes.push(type);
                }
            }
        }

        function initKrathongModel() {
            krathongPoints.length = 0;
            krathongColors.length = 0;
            krathongNormals.length = 0;
            krathongTypes.length = 0;

            const scale = 0.65;

            // 1. Layer 1: Outermost Folded Banana Leaves (16 กลีบ ฐานกว้างบานออก)
            for (let i = 0; i < 16; i++) {
                const ang = (i / 16) * Math.PI * 2;
                build3DPetal(ang, 1.35, 1.40, 0.46, -0.12, 0.92, 'leaf');
            }

            // 2. Layer 2: Outermost Blooming Lotus Petals (14 กลีบ บานทรงแอ่ง)
            for (let i = 0; i < 14; i++) {
                const ang = ((i + 0.5) / 14) * Math.PI * 2;
                build3DPetal(ang, 1.05, 1.30, 0.42, -0.05, 0.74, 'petal_out');
            }

            // 3. Layer 3: Middle Lotus Petals (12 กลีบ ชูชันขึ้น)
            for (let i = 0; i < 12; i++) {
                const ang = (i / 12) * Math.PI * 2;
                build3DPetal(ang, 0.72, 1.15, 0.38, 0.02, 0.54, 'petal_mid');
            }

            // 4. Layer 4: Inner Lotus Petals (10 กลีบ โอบรอบเกสร)
            for (let i = 0; i < 10; i++) {
                const ang = ((i + 0.5) / 10) * Math.PI * 2;
                build3DPetal(ang, 0.38, 0.98, 0.34, 0.08, 0.34, 'petal_in');
            }

            // 5. Layer 5: Marigold Garland Ring (8 ช่อ ดอกไม้สีทองอร่ามล้อมโคนเทียน)
            for (let i = 0; i < 8; i++) {
                const ang = (i / 8) * Math.PI * 2;
                build3DPetal(ang, 0.20, 0.68, 0.28, 0.12, 0.18, 'flower');
            }

            // 6. Base Banana Trunk Disc
            for (let r = 0.20 * scale; r <= 1.40 * scale; r += 0.12 * scale) {
                for (let a = 0; a < Math.PI * 2; a += Math.PI / 14) {
                    const x = r * Math.cos(a);
                    const z = r * Math.sin(a);
                    krathongPoints.push([x, -0.12 * scale, z]);
                    krathongColors.push([40, 95, 25]);
                    krathongNormals.push([0, -1, 0]);
                    krathongTypes.push('base');

                    krathongPoints.push([x, -0.22 * scale, z]);
                    krathongColors.push([28, 70, 18]);
                    krathongNormals.push([0, -1, 0]);
                    krathongTypes.push('base');
                }
            }

            // 7. Tall 3D Center Candle (เทียนแท่งทรงกระบอก 3D ตั้งตรงกลาง)
            for (let h = 0.10 * scale; h <= 1.40 * scale; h += 0.07 * scale) {
                for (let a = 0; a < Math.PI * 2; a += Math.PI / 6) {
                    const rCandle = 0.09 * scale;
                    krathongPoints.push([rCandle * Math.cos(a), h, rCandle * Math.sin(a)]);
                    krathongColors.push([255, 245, 195]);
                    krathongNormals.push([Math.cos(a), 0, Math.sin(a)]);
                    krathongTypes.push('candle');
                }
            }

            // 8. 3 Incense Sticks (ธูป 3 ดอก ปักเอียงตามประเพณี)
            const incenseAngles = [-0.18, 0.0, 0.18];
            for (let idx = 0; idx < 3; idx++) {
                const tilt = incenseAngles[idx];
                for (let h = 0.10 * scale; h <= 1.80 * scale; h += 0.08 * scale) {
                    const xi = (idx - 1) * 0.08 * scale + Math.sin(tilt) * h;
                    const zi = 0.08 * scale + Math.cos(tilt) * 0.02 * scale;
                    const isTip = (h >= 1.70 * scale);
                    krathongPoints.push([xi, h, zi]);
                    krathongColors.push(isTip ? [255, 130, 40] : [160, 80, 45]);
                    krathongNormals.push([0, 1, 0]);
                    krathongTypes.push(isTip ? 'incense_tip' : 'incense');
                }
            }
        }
        initKrathongModel();

        // =========================================================
        // 2. BACKGROUND PANORAMA DATA (STARS, LANTERNS)
        // =========================================================
        let stars = [];
        function initBackgroundStars() {
            stars = [];
            const numStars = Math.floor(COLS * 0.75);
            const starChars = [".", "+", "*", "·", "'", "`"];
            for (let i = 0; i < numStars; i++) {
                stars.push({
                    x: Math.random(),
                    y: Math.random() * 0.44,
                    char: starChars[Math.floor(Math.random() * starChars.length)],
                    speed: 1.2 + Math.random() * 2.8,
                    phase: Math.random() * Math.PI * 2
                });
            }
        }

        const lanterns = [
            { x: 0.16, y: 0.18, lines: ["7&8#", "#8*:"], speed: 0.016 },
            { x: 0.28, y: 0.28, lines: ["488", "1&85"], speed: 0.013 },
            { x: 0.50, y: 0.12, lines: ["100#", "%&0#*", "9&8"], speed: 0.011 }
        ];

        window.addEventListener('resize', resize);
        resize();

        const startTime = Date.now();

        function render() {
            const t = (Date.now() - startTime) * 0.001;

            ctx.fillStyle = "#000000";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const gridChar = new Array(ROWS);
            const gridR = new Array(ROWS);
            const gridG = new Array(ROWS);
            const gridB = new Array(ROWS);
            const gridGlow = new Array(ROWS);
            const gridZ = new Array(ROWS);

            for (let r = 0; r < ROWS; r++) {
                gridChar[r] = new Array(COLS).fill(" ");
                gridR[r] = new Float32Array(COLS);
                gridG[r] = new Float32Array(COLS);
                gridB[r] = new Float32Array(COLS);
                gridGlow[r] = new Uint8Array(COLS);
                gridZ[r] = new Float32Array(COLS).fill(-99999.0);
            }

            const horizonR = Math.floor(ROWS * 0.52);
            const centerC = Math.floor(COLS * 0.50);

            // ==========================================
            // 1. SKY & STARS
            // ==========================================
            for (let s of stars) {
                const sc = Math.floor(s.x * COLS);
                const sr = Math.floor(s.y * ROWS);
                if (sr < horizonR && sc >= 0 && sc < COLS) {
                    const shimmer = Math.sin(t * s.speed + s.phase) * 0.5 + 0.5;
                    if (shimmer > 0.3) {
                        gridChar[sr][sc] = s.char;
                        const bright = 175 + shimmer * 80;
                        gridR[sr][sc] = bright;
                        gridG[sr][sc] = bright;
                        gridB[sr][sc] = Math.min(255, bright + 15);
                        if (shimmer > 0.85) gridGlow[sr][sc] = 1;
                    }
                }
            }

            // ==========================================
            // 2. PERFECTLY ROUND FULL MOON (พระจันทร์กลมดิบ 100%)
            // ==========================================
            const moonCenterCol = Math.floor(COLS * 0.82);
            const moonCenterRow = Math.floor(ROWS * 0.18);
            const moonRadiusPx = Math.min(canvas.width, canvas.height) * 0.095;

            const checkRadiusCols = Math.ceil((moonRadiusPx * 1.8) / CHAR_W);
            const checkRadiusRows = Math.ceil((moonRadiusPx * 1.8) / CHAR_H);

            for (let dr = -checkRadiusRows; dr <= checkRadiusRows; dr++) {
                const r = moonCenterRow + dr;
                if (r < 0 || r >= horizonR) continue;
                for (let dc = -checkRadiusCols; dc <= checkRadiusCols; dc++) {
                    const c = moonCenterCol + dc;
                    if (c < 0 || c >= COLS) continue;

                    const pxDist = Math.sqrt((dc * CHAR_W) ** 2 + (dr * CHAR_H) ** 2);

                    if (pxDist <= moonRadiusPx) {
                        const dNorm = pxDist / moonRadiusPx;
                        const moonChars = ["@", "0", "0", "8", "%", "#", "&", "+"];
                        const charIdx = (Math.abs(dc * 3 + dr * 7) + Math.floor(t * 1.5)) % moonChars.length;
                        gridChar[r][c] = moonChars[charIdx];

                        const bright = 255 - dNorm * 18;
                        gridR[r][c] = bright;
                        gridG[r][c] = bright * 0.98;
                        gridB[r][c] = bright * 0.92;
                        gridGlow[r][c] = 2;
                    } else if (pxDist <= moonRadiusPx * 1.65) {
                        const auraProg = 1.0 - (pxDist - moonRadiusPx) / (moonRadiusPx * 0.65);
                        if (Math.random() < auraProg * 0.40) {
                            gridChar[r][c] = (dr + dc) % 2 === 0 ? "·" : "+";
                            gridR[r][c] = 230 * auraProg;
                            gridG[r][c] = 220 * auraProg;
                            gridB[r][c] = 190 * auraProg;
                            gridGlow[r][c] = 1;
                        }
                    }
                }
            }

            // ==========================================
            // 3. SKY LANTERNS (โคมลอยยี่เป็ง)
            // ==========================================
            for (let lant of lanterns) {
                const driftX = (lant.x + t * lant.speed * 0.15) % 1.0;
                const driftY = ((lant.y - t * lant.speed * 1.5) % 0.44 + 0.44) % 0.44;
                const lCol = Math.floor(driftX * COLS);
                const lRow = Math.floor(driftY * ROWS);
                const flicker = Math.sin(t * 12 + lant.x * 20) * 0.2 + 0.8;

                for (let lr = 0; lr < lant.lines.length; lr++) {
                    const line = lant.lines[lr];
                    const r = lRow + lr;
                    if (r >= 0 && r < horizonR) {
                        for (let lc = 0; lc < line.length; lc++) {
                            const c = lCol + lc - Math.floor(line.length / 2);
                            if (c >= 0 && c < COLS) {
                                gridChar[r][c] = line[lc];
                                gridR[r][c] = 255;
                                gridG[r][c] = Math.floor(168 * flicker);
                                gridB[r][c] = 45;
                                gridGlow[r][c] = 2;
                            }
                        }
                    }
                }
            }

            // ==========================================
            // 4. CLEAN THAI TEMPLE ON LEFT (หลังคาทรงจั่วแน่นๆ ฝั่งซ้าย)
            // ==========================================
            const leftTempleC = Math.floor(COLS * 0.22);
            const templeHalfW = Math.floor(COLS * 0.14);
            const wallH = Math.floor(ROWS * 0.11);
            const roofH = Math.floor(ROWS * 0.20);
            const wallTop = horizonR - wallH;
            const roofPeakR = wallTop - roofH;

            // ผืนหลังคาวัดทรงจั่วแน่นๆ (Solid Gabled Roof)
            for (let r = roofPeakR; r < wallTop; r++) {
                const prog = (r - roofPeakR) / roofH;
                const halfSpan = Math.floor(prog * templeHalfW);

                for (let dc = -halfSpan; dc <= halfSpan; dc++) {
                    const c = leftTempleC + dc;
                    if (c < 0 || c >= COLS) continue;

                    const isRidge = (Math.abs(dc) === halfSpan);
                    if (isRidge) {
                        gridChar[r][c] = "%";
                        gridR[r][c] = 245; gridG[r][c] = 155; gridB[r][c] = 50;
                        gridGlow[r][c] = 1;
                    } else if (r === roofPeakR) {
                        gridChar[r][c] = "^";
                        gridR[r][c] = 255; gridG[r][c] = 190; gridB[r][c] = 60;
                        gridGlow[r][c] = 2;
                    } else {
                        const tileTier = (r % 3 === 0);
                        gridChar[r][c] = tileTier ? "=" : (Math.abs(dc) % 2 === 0 ? "#" : "%");
                        gridR[r][c] = tileTier ? 210 : 185;
                        gridG[r][c] = tileTier ? 115 : 95;
                        gridB[r][c] = tileTier ? 45 : 35;
                    }
                }
            }

            // ยอดช่อฟ้าปลายจั่ว
            if (roofPeakR - 1 >= 0 && leftTempleC < COLS) {
                gridChar[roofPeakR - 1][leftTempleC] = "^";
                gridR[roofPeakR - 1][leftTempleC] = 255; gridG[roofPeakR - 1][leftTempleC] = 210; gridB[roofPeakR - 1][leftTempleC] = 70;
                gridGlow[roofPeakR - 1][leftTempleC] = 2;
            }
            if (wallTop - 1 >= 0) {
                const leftTipC = leftTempleC - templeHalfW;
                const rightTipC = leftTempleC + templeHalfW;
                if (leftTipC >= 0) {
                    gridChar[wallTop - 1][leftTipC] = "^";
                    gridR[wallTop - 1][leftTipC] = 255; gridG[wallTop - 1][leftTipC] = 190; gridB[wallTop - 1][leftTipC] = 60;
                    gridGlow[wallTop - 1][leftTipC] = 2;
                }
                if (rightTipC < COLS) {
                    gridChar[wallTop - 1][rightTipC] = "^";
                    gridR[wallTop - 1][rightTipC] = 255; gridG[wallTop - 1][rightTipC] = 190; gridB[wallTop - 1][rightTipC] = 60;
                    gridGlow[wallTop - 1][rightTipC] = 2;
                }
            }

            // หน้าบันกนกสีทอง
            const pedimentH = Math.floor(roofH * 0.50);
            for (let r = wallTop - pedimentH; r < wallTop; r++) {
                const pSpan = Math.floor(((r - (wallTop - pedimentH)) / pedimentH) * (templeHalfW * 0.55));
                for (let dc = -pSpan; dc <= pSpan; dc++) {
                    const c = leftTempleC + dc;
                    if (c >= 0 && c < COLS) {
                        gridChar[r][c] = "*";
                        gridR[r][c] = 255; gridG[r][c] = 195; gridB[r][c] = 60;
                        gridGlow[r][c] = 1;
                    }
                }
            }

            // ตัวอาคารอุโบสถ เสาพาไล และซุ้มประตูทอง
            const wallHalfW = Math.floor(templeHalfW * 0.85);
            for (let r = wallTop; r < horizonR; r++) {
                for (let c = leftTempleC - wallHalfW; c <= leftTempleC + wallHalfW; c++) {
                    if (c < 0 || c >= COLS) continue;
                    gridChar[r][c] = (c % 2 === 0) ? ":" : ".";
                    gridR[r][c] = 100; gridG[r][c] = 60; gridB[r][c] = 28;
                }
            }

            // เสาพาไล
            const numPillars = 6;
            const pStep = Math.floor((wallHalfW * 2) / (numPillars - 1));
            for (let p = 0; p < numPillars; p++) {
                const pc = (leftTempleC - wallHalfW) + p * pStep;
                for (let r = wallTop; r < horizonR; r++) {
                    if (pc >= 0 && pc < COLS) {
                        gridChar[r][pc] = "|";
                        gridR[r][pc] = 230; gridG[r][pc] = 150; gridB[r][pc] = 60;
                        gridGlow[r][pc] = 1;
                    }
                }
            }

            // ซุ้มประตูกลางเรืองแสงทอง
            const doorW = 3;
            const doorH = Math.floor(wallH * 0.75);
            for (let r = horizonR - doorH; r < horizonR; r++) {
                for (let dc = -doorW; dc <= doorW; dc++) {
                    const c = leftTempleC + dc;
                    if (c >= 0 && c < COLS) {
                        gridChar[r][c] = (r === horizonR - doorH) ? "∩" : "0";
                        gridR[r][c] = 255; gridG[r][c] = 220; gridB[r][c] = 95;
                        gridGlow[r][c] = 2;
                    }
                }
            }

            // ==========================================
            // 5. MAJESTIC THAI CHEDI ON THE RIGHT
            // (พระเจดีย์ทรงระฆังคว่ำแบบไทยแท้ฝั่งขวา ตรงตามรูปที่ผู้ใช้ส่งมาเป๊ะๆ)
            // ==========================================
            function drawThaiChedi(centerCol, baseRow, width, height) {
                // Tier 1: Stepped Plinth / ฐานเขียง 3 ชั้น
                const plinthH = Math.floor(height * 0.18);
                for (let i = 0; i < 3; i++) {
                    const tierR = baseRow - Math.floor((i + 1) * (plinthH / 3));
                    const tierW = Math.floor(width * (1.0 - i * 0.08));
                    for (let r = tierR; r <= tierR + Math.floor(plinthH / 3); r++) {
                        for (let dc = -tierW; dc <= tierW; dc++) {
                            const c = centerCol + dc;
                            if (c >= 0 && c < COLS && r < baseRow) {
                                const isEdge = (Math.abs(dc) === tierW || r === tierR);
                                gridChar[r][c] = isEdge ? "=" : ":";
                                gridR[r][c] = isEdge ? 240 : 140;
                                gridG[r][c] = isEdge ? 165 : 85;
                                gridB[r][c] = isEdge ? 55 : 35;
                                if (isEdge) gridGlow[r][c] = 1;
                            }
                        }
                    }
                }

                // Tier 2: Bell Body / องค์ระฆังคว่ำสีทอง (Curved Bell Silhouette)
                const bellH = Math.floor(height * 0.38);
                const bellBaseR = baseRow - plinthH;
                const bellTopR = bellBaseR - bellH;
                const bellBaseW = Math.floor(width * 0.72);

                for (let r = bellTopR; r < bellBaseR; r++) {
                    const normY = (r - bellTopR) / bellH; // 0 at top, 1 at base
                    // Traditional Thai bell curvature (เว้าคอดด้านบน และผายออกด้านล่าง)
                    const bellCurveW = Math.floor(bellBaseW * (0.35 + 0.65 * Math.sin(normY * Math.PI * 0.5)));

                    for (let dc = -bellCurveW; dc <= bellCurveW; dc++) {
                        const c = centerCol + dc;
                        if (c >= 0 && c < COLS) {
                            const isEdge = (Math.abs(dc) === bellCurveW);
                            gridChar[r][c] = isEdge ? "%" : (normY > 0.8 ? "=" : "8");
                            gridR[r][c] = isEdge ? 255 : 225;
                            gridG[r][c] = isEdge ? 185 : 155;
                            gridB[r][c] = isEdge ? 65 : 45;
                            gridGlow[r][c] = isEdge ? 2 : 1;
                        }
                    }
                }

                // Tier 3: Throne (บัลลังก์สี่เหลี่ยมเหนือองค์ระฆัง)
                const throneH = Math.floor(height * 0.08);
                const throneW = Math.floor(bellBaseW * 0.42);
                for (let r = bellTopR - throneH; r < bellTopR; r++) {
                    for (let dc = -throneW; dc <= throneW; dc++) {
                        const c = centerCol + dc;
                        if (c >= 0 && c < COLS) {
                            gridChar[r][c] = (Math.abs(dc) === throneW) ? "#" : "=";
                            gridR[r][c] = 250; gridG[r][c] = 190; gridB[r][c] = 60;
                            gridGlow[r][c] = 1;
                        }
                    }
                }

                // Tier 4: Spire Rings & Needle Tip (ปล้องไฉน ปลียอด เม็ดน้ำค้าง สู่ดวงจันทร์)
                const spireBaseR = bellTopR - throneH;
                const spireH = height - (plinthH + bellH + throneH);

                for (let sh = 0; sh < spireH; sh++) {
                    const r = spireBaseR - sh;
                    if (r < 0 || r >= horizonR) continue;
                    const normH = sh / spireH; // 0 at base, 1 at tip
                    const ringW = Math.max(0, Math.floor((1.0 - normH) * (throneW * 0.75)));

                    for (let dc = -ringW; dc <= ringW; dc++) {
                        const c = centerCol + dc;
                        if (c >= 0 && c < COLS) {
                            const ch = (normH > 0.85) ? (dc === 0 ? "!" : "|") : ((sh % 2 === 0) ? "=" : "#");
                            gridChar[r][c] = ch;
                            gridR[r][c] = 255;
                            gridG[r][c] = 210 - normH * 30;
                            gridB[r][c] = 70;
                            gridGlow[r][c] = 2; // ยอดสถูปสีทองสว่างจ้าสู่ดวงจันทร์
                        }
                    }
                }
            }

            // Draw Main Thai Chedi on the Right (ตรงใต้พระจันทร์ ยอดชี้สู่ดวงจันทร์)
            const mainChediC = Math.floor(COLS * 0.82);
            const mainChediW = Math.floor(COLS * 0.11);
            const mainChediH = Math.floor(ROWS * 0.32);
            drawThaiChedi(mainChediC, horizonR, mainChediW, mainChediH);

            // Draw Companion Chedi to the left of main chedi (เหมือนรูปที่ 1 ในภาพ)
            const subChediC = Math.floor(COLS * 0.72);
            const subChediW = Math.floor(COLS * 0.065);
            const subChediH = Math.floor(ROWS * 0.20);
            drawThaiChedi(subChediC, horizonR, subChediW, subChediH);

            // Center Spires & Golden Radial Light (ตรงกลาง)
            const spireConfigs = [
                { offset: -7, h: Math.floor(ROWS * 0.16) },
                { offset: -3, h: Math.floor(ROWS * 0.21) },
                { offset:  0, h: Math.floor(ROWS * 0.28) },
                { offset:  3, h: Math.floor(ROWS * 0.22) },
                { offset:  7, h: Math.floor(ROWS * 0.17) }
            ];
            for (let sp of spireConfigs) {
                const sc = centerC + sp.offset;
                if (sc < 0 || sc >= COLS) continue;
                for (let i = 0; i < sp.h; i++) {
                    const r = horizonR - sp.h + i;
                    if (r >= 0 && r < horizonR) {
                        gridChar[r][sc] = (i === sp.h - 1) ? "!" : "|";
                        gridR[r][sc] = 255;
                        gridG[r][sc] = 180 + (i / sp.h) * 65;
                        gridB[r][sc] = 50;
                        gridGlow[r][sc] = 2;
                    }
                }
            }

            // แสงสีทองระเบิดกลางขอบฟ้า
            const blastRadiusC = Math.floor(COLS * 0.18);
            const blastRadiusR = Math.floor(ROWS * 0.14);
            for (let dr = -blastRadiusR; dr <= 2; dr++) {
                const r = horizonR + dr;
                if (r < 0 || r >= ROWS) continue;
                for (let dc = -blastRadiusC; dc <= blastRadiusC; dc++) {
                    const c = centerC + dc;
                    if (c < 0 || c >= COLS) continue;
                    const dNorm = Math.sqrt((dc / blastRadiusC) ** 2 + (dr / blastRadiusR) ** 2);
                    if (dNorm <= 1.0) {
                        const intensity = (1.0 - dNorm) ** 1.5;
                        gridR[r][c] = Math.min(255, gridR[r][c] + 255 * intensity);
                        gridG[r][c] = Math.min(255, gridG[r][c] + 225 * intensity);
                        gridB[r][c] = Math.min(255, gridB[r][c] + 130 * intensity);
                        gridGlow[r][c] = 2;
                    }
                }
            }

            // แนวขอบฟ้ากลืนกับผิวน้ำ (shore line blends into water)
            for (let c = 0; c < COLS; c++) {
                const shimmer = Math.sin(c * 0.30 + t * 1.6) * 0.5 + 0.5;
                gridChar[horizonR][c] = shimmer > 0.62 ? "~" : (shimmer > 0.35 ? "." : " ");
                gridR[horizonR][c] = 55 + shimmer * 55;
                gridG[horizonR][c] = 120 + shimmer * 60;
                gridB[horizonR][c] = 170 + shimmer * 55;
                gridGlow[horizonR][c] = 1;
                if (c % 7 === 0) {
                    gridChar[horizonR - 1][c] = "*";
                    gridR[horizonR - 1][c] = 255; gridG[horizonR - 1][c] = 190; gridB[horizonR - 1][c] = 50;
                    gridGlow[horizonR - 1][c] = 2;
                }
            }

            // ==========================================
            // 6. FLOWING BLUE WATER (ผิวน้ำสีฟ้าลื่นไหล)
            // ==========================================
            for (let r = horizonR + 1; r < ROWS; r++) {
                const depthProg = (r - horizonR) / (ROWS - horizonR);
                for (let c = 0; c < COLS; c++) {
                    // Multi-layer flowing waves (คลื่นไหลหลายชั้นต่อเนื่อง)
                    const wave1 = Math.sin(c * 0.18 + r * 0.30 + t * 2.2);
                    const wave2 = Math.sin(c * 0.09 - r * 0.16 + t * 1.5 + Math.sin(c * 0.05 + t * 0.7) * 1.4);
                    const flow = wave1 * 0.6 + wave2 * 0.4;

                    if (flow > 0.35) {
                        // ยอดคลื่น ไล่จากฟ้าอ่อนใกล้ฝั่งไปฟ้าเข้มลึก
                        gridChar[r][c] = (c + Math.floor(t * 3)) % 4 === 0 ? "~" : "-";
                        gridR[r][c] = 90 + 55 * (1.0 - depthProg);
                        gridG[r][c] = 165 + 45 * (1.0 - depthProg);
                        gridB[r][c] = 235 + 20 * (1.0 - depthProg);
                        if (flow > 0.80) gridGlow[r][c] = 1;
                    } else if (flow < -0.62) {
                        // ร่องคลื่นสีน้ำเงินเข้ม
                        gridChar[r][c] = "/";
                        gridR[r][c] = 10 + 10 * (1.0 - depthProg);
                        gridG[r][c] = 45 + 35 * (1.0 - depthProg);
                        gridB[r][c] = 110 + 60 * (1.0 - depthProg);
                    } else {
                        // พื้นน้ำอ่อน ๆ ต่อเนื่องไหลไปกับคลื่น
                        gridChar[r][c] = (Math.sin(c * 0.25 - t * 1.9 + r) > 0.7) ? "." : " ";
                        gridR[r][c] = 35 + 40 * (1.0 - depthProg);
                        gridG[r][c] = 95 + 60 * (1.0 - depthProg);
                        gridB[r][c] = 165 + 65 * (1.0 - depthProg);
                    }
                }
            }

            // ==========================================
            // 7. ULTRA HIGH-DETAIL 3D LOTUS KRATHONG PROJECTION
            // (กระทง 3 มิติวิจิตรตระการตา กลีบดอกบัวโค้งเว้าบานเป็นแอ่ง มีแสงเงา)
            // ==========================================
            const autoRotY = t * 0.35;
            const bobY = Math.sin(t * 2.2) * 0.04;
            const camPitch = 0.50; // มุมก้มลงกำลังดี เห็นแอ่งดอกบัว กลีบซ้อน และเทียนชัดเจน
            const camDist = 4.4;
            const fov = Math.min(COLS * CHAR_W, ROWS * CHAR_H) * 0.92;

            const projected3D = [];

            // Light vector for realistic 3D normal shading
            const lightDir = [0.35, 0.85, -0.40];
            const lMag = Math.sqrt(lightDir[0]**2 + lightDir[1]**2 + lightDir[2]**2);
            lightDir[0] /= lMag; lightDir[1] /= lMag; lightDir[2] /= lMag;

            for (let i = 0; i < krathongPoints.length; i++) {
                const p = krathongPoints[i];
                const col = krathongColors[i];
                const norm = krathongNormals[i];
                const mat = krathongTypes[i];

                // 1. Azimuth Rotation around Y-axis
                const cy = Math.cos(autoRotY), sy = Math.sin(autoRotY);
                let x1 = p[0] * cy + p[2] * sy;
                let z1 = -p[0] * sy + p[2] * cy;
                let y1 = p[1] + bobY;

                let nx1 = norm[0] * cy + norm[2] * sy;
                let nz1 = -norm[0] * sy + norm[2] * cy;
                let ny1 = norm[1];

                // 2. Camera Pitch (X-axis rotation)
                const cx = Math.cos(camPitch), sx = Math.sin(camPitch);
                let y2 = y1 * cx - z1 * sx;
                let z2 = y1 * sx + z1 * cx + camDist;

                let ny2 = ny1 * cx - nz1 * sx;
                let nz2 = ny1 * sx + nz1 * cx;

                if (z2 <= 0.2) continue;

                // 3. Perspective Projection
                const screenX = (x1 / z2) * (fov / CHAR_W) + centerC;
                const screenY = -(y2 / z2) * (fov / CHAR_H) + (ROWS * 0.68);

                const c = Math.floor(screenX);
                const r = Math.floor(screenY);

                if (r >= 0 && r < ROWS && c >= 0 && c < COLS) {
                    const depth = -z2;
                    if (depth > gridZ[r][c]) {
                        gridZ[r][c] = depth;

                        // 3D Diffuse shading
                        const dot = Math.max(0.25, (nx1 * lightDir[0] + ny2 * lightDir[1] + nz2 * lightDir[2]));
                        const shadedR = Math.min(255, col[0] * (0.60 + dot * 0.40));
                        const shadedG = Math.min(255, col[1] * (0.60 + dot * 0.40));
                        const shadedB = Math.min(255, col[2] * (0.60 + dot * 0.40));

                        let ch;
                        let glow = 1;
                        if (mat === 'leaf') {
                            ch = dot > 0.65 ? "%" : "+";
                        } else if (mat === 'petal_out') {
                            ch = dot > 0.65 ? "@" : "%";
                            glow = 2;
                        } else if (mat === 'petal_mid') {
                            ch = dot > 0.55 ? "%" : "&";
                            glow = 2;
                        } else if (mat === 'petal_in') {
                            ch = dot > 0.60 ? "8" : "&";
                            glow = 2;
                        } else if (mat === 'flower') {
                            ch = "*";
                            glow = 2;
                        } else if (mat === 'candle') {
                            ch = "1";
                            glow = 1;
                        } else if (mat === 'incense_tip') {
                            ch = "*";
                            glow = 2;
                        } else if (mat === 'incense') {
                            ch = "|";
                            glow = 0;
                        } else {
                            ch = "#";
                        }

                        gridChar[r][c] = ch;
                        gridR[r][c] = shadedR;
                        gridG[r][c] = shadedG;
                        gridB[r][c] = shadedB;
                        gridGlow[r][c] = glow;

                        projected3D.push({ r, c, col: [shadedR, shadedG, shadedB], z2 });
                    }
                }
            }

            // 3D Candle Flame Particles (เปลวเทียนสว่างจ้าสั่นไหว 3D)
            const candleTop = 0.90 + bobY;
            for (let f = 0; f < 36; f++) {
                const fPhase = ((t * 2.5 + f * 0.10) % 1.0);
                const fy = candleTop + fPhase * 0.52;
                const fr = 0.065 * (1.0 - fPhase);
                const fa = f * 2.4;
                const fx = Math.cos(fa) * fr + Math.sin(t * 16) * 0.02 * fPhase;
                const fz = Math.sin(fa) * fr;

                const cy = Math.cos(autoRotY), sy = Math.sin(autoRotY);
                let x1 = fx * cy + fz * sy;
                let z1 = -fx * sy + fz * cy;
                let y1 = fy;

                const cx = Math.cos(camPitch), sx = Math.sin(camPitch);
                let y2 = y1 * cx - z1 * sx;
                let z2 = y1 * sx + z1 * cx + camDist;

                const c = Math.floor((x1 / z2) * (fov / CHAR_W) + centerC);
                const r = Math.floor(-(y2 / z2) * (fov / CHAR_H) + (ROWS * 0.68));

                if (r >= 0 && r < ROWS && c >= 0 && c < COLS) {
                    let col = fPhase < 0.25 ? [255, 255, 240] : fPhase < 0.65 ? [255, 205, 50] : [255, 90, 20];
                    gridChar[r][c] = fPhase < 0.25 ? "1" : (fPhase < 0.65 ? "|" : "*");
                    gridR[r][c] = col[0];
                    gridG[r][c] = col[1];
                    gridB[r][c] = col[2];
                    gridGlow[r][c] = 2;
                }
            }

            // ==========================================
            // 8. 3D WATER REFLECTION
            // ==========================================
            const waterLine = Math.floor(ROWS * 0.67);
            for (let i = 0; i < projected3D.length; i += 2) {
                const pt = projected3D[i];
                if (pt.r < waterLine) {
                    const distToWater = waterLine - pt.r;
                    const reflR = waterLine + Math.floor(distToWater * 0.72);
                    if (reflR < ROWS) {
                        const waveShift = Math.floor(Math.sin(pt.c * 0.15 + t * 3.8) * 2.2);
                        const c = pt.c + waveShift;
                        if (c >= 0 && c < COLS && gridZ[reflR][c] < -9000.0) {
                            if ((c + reflR + Math.floor(t * 2)) % 3 !== 0) {
                                const prog = (reflR - waterLine) / (ROWS - waterLine);
                                const decay = (1.0 - prog * 0.75);
                                gridChar[reflR][c] = (reflR + c) % 2 === 0 ? "~" : "=";
                                gridR[reflR][c] = Math.min(255, pt.col[0] * 0.50 * decay + 8);
                                gridG[reflR][c] = Math.min(255, pt.col[1] * 0.60 * decay + 30);
                                gridB[reflR][c] = Math.min(255, pt.col[2] * 0.35 * decay + 18);
                                if (prog < 0.25) gridGlow[reflR][c] = 1;
                            }
                        }
                    }
                }
            }

            // Floating green water patches
            const patchList = [
                { x: 0.12, y: 0.76, text: "1111" },
                { x: 0.06, y: 0.88, text: "111111" },
                { x: 0.22, y: 0.94, text: "||||" },
                { x: 0.80, y: 0.78, text: "1101" },
                { x: 0.86, y: 0.90, text: "111111" },
                { x: 0.92, y: 0.86, text: "&o" }
            ];
            for (let pt of patchList) {
                const pr = Math.floor(pt.y * ROWS);
                const pc = Math.floor(pt.x * COLS);
                if (pr > horizonR && pr < ROWS) {
                    for (let i = 0; i < pt.text.length; i++) {
                        const c = pc + i;
                        if (c >= 0 && c < COLS) {
                            gridChar[pr][c] = pt.text[i];
                            gridR[pr][c] = 115;
                            gridG[pr][c] = 245;
                            gridB[pr][c] = 90;
                            gridGlow[pr][c] = 1;
                        }
                    }
                }
            }

            // ==========================================
            // 9. TWO-PASS CANVAS RENDERING (BLOOM & CRISP TEXT)
            // ==========================================
            ctx.font = `bold ${FONT_SIZE}px 'Consolas', 'Courier New', monospace`;
            ctx.textBaseline = "top";

            // Pass 1: Luminous Bloom Glow Pass
            for (let r = 0; r < ROWS; r++) {
                const y = r * CHAR_H;
                for (let c = 0; c < COLS; c++) {
                    const glow = gridGlow[r][c];
                    if (glow > 0) {
                        const ch = gridChar[r][c];
                        const x = c * CHAR_W;
                        const red = gridR[r][c];
                        const green = gridG[r][c];
                        const blue = gridB[r][c];

                        ctx.shadowColor = `rgb(${red}, ${green}, ${blue})`;
                        ctx.shadowBlur = (glow === 2) ? 14 : 7;
                        ctx.fillStyle = `rgb(${red}, ${green}, ${blue})`;
                        ctx.fillText(ch, x, y);
                    }
                }
            }

            // Pass 2: Crisp Monospace ASCII Foreground Pass
            ctx.shadowBlur = 0;
            for (let r = 0; r < ROWS; r++) {
                const y = r * CHAR_H;
                for (let c = 0; c < COLS; c++) {
                    const ch = gridChar[r][c];
                    if (ch !== " ") {
                        const x = c * CHAR_W;
                        const red = gridR[r][c];
                        const green = gridG[r][c];
                        const blue = gridB[r][c];
                        ctx.fillStyle = `rgb(${red}, ${green}, ${blue})`;
                        ctx.fillText(ch, x, y);
                    }
                }
            }

            requestAnimationFrame(render);
        }

        render();
    </script>
</body>
</html>
