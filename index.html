<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loy Krathong Pure ASCII Art</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000000;
        }
        body, html {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        canvas {
            display: block;
            image-rendering: pixelated;
        }
    </style>
</head>
<body>
    <canvas id="asciiCanvas"></canvas>

    <script>
        const canvas = document.getElementById('asciiCanvas');
        const ctx = canvas.getContext('2d');

        // Font & Grid Settings
        const FONT_SIZE = 13;
        const CHAR_W = 7.8;
        const CHAR_H = 13.0;

        let cols = 0;
        let rows = 0;

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            cols = Math.floor(canvas.width / CHAR_W);
            rows = Math.floor(canvas.height / CHAR_H);
        }
        window.addEventListener('resize', resize);
        resize();

        // Character Sets
        const DENSE_CHARS = ["@", "%", "#", "&", "8", "0", "W", "B", "M", "Q"];
        const MID_CHARS   = ["o", "*", "=", "+", "a", "e", "s", "1", "0", "x", "z"];
        const LIGHT_CHARS = ["-", "~", ":", ".", "'", "`", "^", "|", "/", "\\"];
        const WATER_CHARS = ["~", "-", "=", "_", "≈", "/", "\\", "|"];

        // Random Seed for persistent stars & background details
        const stars = [];
        for (let i = 0; i < 90; i++) {
            stars.push({
                x: Math.random(),
                y: Math.random() * 0.42,
                char: Math.random() > 0.4 ? "+" : (Math.random() > 0.5 ? "*" : (Math.random() > 0.5 ? "·" : "o")),
                speed: 1.5 + Math.random() * 3.0,
                phase: Math.random() * Math.PI * 2
            });
        }

        // Floating Lanterns (โคมลอยเป็นกลุ่มตัวอักษร)
        const lanterns = [
            { x: 0.28, y: 0.22, text: ["488", "1&85"], speed: 0.012, seed: 1.1 },
            { x: 0.16, y: 0.15, text: ["7&8#", "#8*:"], speed: 0.015, seed: 2.3 },
            { x: 0.52, y: 0.10, text: ["100#", "%&0#*", "9&8"], speed: 0.011, seed: 3.7 },
            { x: 0.63, y: 0.18, text: ["84&#", "%&0#*", "7#"], speed: 0.014, seed: 5.2 }
        ];

        // Water Floating Petal Clusters (กระจุกตัวอักษรสีเขียว/ฟ้าในน้ำ)
        const waterSparks = [
            { x: 0.18, y: 0.54, text: "1111" },
            { x: 0.11, y: 0.70, text: "111111" },
            { x: 0.75, y: 0.62, text: "1101" },
            { x: 0.76, y: 0.74, text: "111111" },
            { x: 0.88, y: 0.88, text: "&o\n111111" },
            { x: 0.32, y: 0.91, text: "00" }
        ];

        const startTime = Date.now();

        function render() {
            const t = (Date.now() - startTime) * 0.001;

            // Clear black screen
            ctx.fillStyle = "#000000";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Grid Buffers
            // Each cell: { char, r, g, b, glow }
            const gridChar = new Array(rows);
            const gridR = new Array(rows);
            const gridG = new Array(rows);
            const gridB = new Array(rows);
            const gridGlow = new Array(rows);

            for (let r = 0; r < rows; r++) {
                gridChar[r] = new Array(cols).fill(" ");
                gridR[r] = new Float32Array(cols);
                gridG[r] = new Float32Array(cols);
                gridB[r] = new Float32Array(cols);
                gridGlow[r] = new Uint8Array(cols);
            }

            const horizonRow = Math.floor(rows * 0.44);
            const centerCol = Math.floor(cols * 0.50);
            const krathongRow = Math.floor(rows * 0.47);

            // 1. SKY & STARS (ฟ้ามืดสนิทและดวงดาวกระพริบ)
            for (let s of stars) {
                const sc = Math.floor(s.x * cols);
                const sr = Math.floor(s.y * rows);
                if (sr < horizonRow && sc >= 0 && sc < cols) {
                    const shimmer = Math.sin(t * s.speed + s.phase) * 0.5 + 0.5;
                    if (shimmer > 0.3) {
                        gridChar[sr][sc] = s.char;
                        gridR[sr][sc] = 200 + shimmer * 55;
                        gridG[sr][sc] = 220 + shimmer * 35;
                        gridB[sr][sc] = 255;
                        if (shimmer > 0.85) gridGlow[sr][sc] = 1;
                    }
                }
            }

            // 2. FULL MOON (พระจันทร์วันเพ็ญมุมขวาบน ทำจากตัวอักษรหนาแน่นและแสงเรือง)
            const moonC = Math.floor(cols * 0.78);
            const moonR = Math.floor(rows * 0.15);
            const moonRadiusCols = Math.floor(cols * 0.10);
            const moonRadiusRows = Math.floor(rows * 0.075);

            for (let dr = -moonRadiusRows * 2; dr <= moonRadiusRows * 2; dr++) {
                const r = moonR + dr;
                if (r < 0 || r >= horizonRow) continue;
                for (let dc = -moonRadiusCols * 2; dc <= moonRadiusCols * 2; dc++) {
                    const c = moonC + dc;
                    if (c < 0 || c >= cols) continue;

                    const normDist = Math.sqrt((dc / moonRadiusCols) ** 2 + (dr / moonRadiusRows) ** 2);
                    if (normDist <= 1.0) {
                        // Moon Core Body
                        const charIdx = (Math.abs(dc * 3 + dr * 7) + Math.floor(t * 2)) % DENSE_CHARS.length;
                        gridChar[r][c] = DENSE_CHARS[charIdx];
                        const intensity = 1.0 - normDist * 0.3;
                        gridR[r][c] = 255 * intensity;
                        gridG[r][c] = 245 * intensity;
                        gridB[r][c] = 210 * intensity;
                        gridGlow[r][c] = 2; // Strong bloom
                    } else if (normDist <= 1.6) {
                        // Moon outer aura
                        const aura = 1.0 - (normDist - 1.0) / 0.6;
                        if (Math.random() < aura * 0.7) {
                            gridChar[r][c] = (dc + dr) % 2 === 0 ? "·" : "+";
                            gridR[r][c] = 220 * aura;
                            gridG[r][c] = 190 * aura;
                            gridB[r][c] = 130 * aura;
                            gridGlow[r][c] = 1;
                        }
                    }
                }
            }

            // 3. BACKGROUND SILHOUETTE: PAGODAS & TEMPLES (เจดีย์และยอดปราสาท)
            // Left Stupa / Dome Pagoda
            const domeC = Math.floor(cols * 0.20);
            const domeRCols = Math.floor(cols * 0.14);
            const domeRRows = Math.floor(rows * 0.15);
            for (let dc = -domeRCols; dc <= domeRCols; dc++) {
                const c = domeC + dc;
                if (c < 0 || c >= cols) continue;
                const hNorm = Math.sqrt(Math.max(0, 1.0 - (dc / domeRCols) ** 2));
                const topR = horizonRow - Math.floor(hNorm * domeRRows);
                for (let r = topR; r <= horizonRow; r++) {
                    if (r === topR || dc === -domeRCols || dc === domeRCols) {
                        // Contour Outline
                        gridChar[r][c] = "%";
                        gridR[r][c] = 190; gridG[r][c] = 120; gridB[r][c] = 50;
                        gridGlow[r][c] = 1;
                    } else if (r === horizonRow - 1 && (c % 2 === 0)) {
                        gridChar[r][c] = "#";
                        gridR[r][c] = 160; gridG[r][c] = 100; gridB[r][c] = 40;
                    }
                }
            }

            // Right Temple Spire (ปราสาทและยอดแหลม)
            const spireC = Math.floor(cols * 0.86);
            for (let dc = -Math.floor(cols * 0.12); dc <= Math.floor(cols * 0.12); dc++) {
                const c = spireC + dc;
                if (c < 0 || c >= cols) continue;
                const hNorm = Math.max(0, 1.0 - Math.abs(dc) / (cols * 0.12));
                const topR = horizonRow - Math.floor((hNorm ** 1.6) * (rows * 0.22));
                for (let r = topR; r <= horizonRow; r++) {
                    if (r === topR || Math.abs(dc) === Math.floor(cols * 0.12)) {
                        gridChar[r][c] = "#";
                        gridR[r][c] = 200; gridG[r][c] = 130; gridB[r][c] = 60;
                        gridGlow[r][c] = 1;
                    }
                }
            }

            // Horizon line characters
            for (let c = 0; c < cols; c++) {
                gridChar[horizonRow][c] = "-";
                gridR[horizonRow][c] = 80; gridG[horizonRow][c] = 60; gridB[horizonRow][c] = 40;
            }

            // 4. FLOATING LANTERNS (โคมลอยลอยขึ้นฟ้า)
            for (let lant of lanterns) {
                const curY = ((lant.y - t * lant.speed) % 0.42 + 0.42) % 0.42;
                const lCol = Math.floor(lant.x * cols);
                const lRow = Math.floor(curY * rows);
                for (let lineIdx = 0; lineIdx < lant.text.length; lineIdx++) {
                    const textLine = lant.text[lineIdx];
                    const r = lRow + lineIdx;
                    if (r >= 0 && r < horizonRow) {
                        for (let chIdx = 0; chIdx < textLine.length; chIdx++) {
                            const c = lCol + chIdx - Math.floor(textLine.length / 2);
                            if (c >= 0 && c < cols) {
                                gridChar[r][c] = textLine[chIdx];
                                gridR[r][c] = 255;
                                gridG[r][c] = 180;
                                gridB[r][c] = 70;
                                gridGlow[r][c] = 2;
                            }
                        }
                    }
                }
            }

            // 5. BLUE WATER MATRIX BACKGROUND (ผิวน้ำสีฟ้าเข้มตัวอักษรทั้งครึ่งล่าง)
            for (let r = horizonRow + 1; r < rows; r++) {
                const depthNorm = (r - horizonRow) / (rows - horizonRow);
                for (let c = 0; c < cols; c++) {
                    const wave = Math.sin(c * 0.25 + r * 0.65 + t * 3.0);
                    // Blue water character choices
                    if (wave > 0.45) {
                        gridChar[r][c] = (c + r) % 3 === 0 ? "~" : "-";
                        // Deep cyan/blue glow
                        gridR[r][c] = 10 + 15 * depthNorm;
                        gridG[r][c] = 45 + 50 * (1.0 - depthNorm);
                        gridB[r][c] = 85 + 75 * (1.0 - depthNorm);
                    } else if (wave < -0.6) {
                        gridChar[r][c] = "/";
                        gridR[r][c] = 8;
                        gridG[r][c] = 30;
                        gridB[r][c] = 55;
                    }
                }
            }

            // 6. KRATHONG (กระทงดอกบัว - กลีบเขียว, บัวชมพู, แกนทอง, เปลวเทียน)
            const kwCols = Math.floor(cols * 0.28);
            const khRows = Math.floor(rows * 0.11);
            const bobY = Math.sin(t * 2.5) * 0.6;
            const actualKrathongRow = krathongRow + Math.floor(bobY);

            // Base & Lotus Petals Grid
            for (let dr = -khRows; dr <= khRows; dr++) {
                const r = actualKrathongRow + dr;
                if (r < 0 || r >= rows) continue;
                for (let dc = -kwCols; dc <= kwCols; dc++) {
                    const c = centerCol + dc;
                    if (c < 0 || c >= cols) continue;

                    const nx = dc / kwCols;
                    const ny = dr / khRows;
                    const distSq = nx * nx + ny * ny;

                    if (distSq <= 1.0) {
                        const dist = Math.sqrt(distSq);
                        let ch, cr, cg, cb, isGlow = 0;

                        if (dist > 0.70) {
                            // Layer 1: Outermost Banana Leaves (สีเขียวตองสดใส 1, 0, &, 8, %)
                            const charIdx = (Math.abs(dc * 5 + dr * 7) + Math.floor(t * 3)) % MID_CHARS.length;
                            ch = MID_CHARS[charIdx];
                            cr = 140 - dist * 40;
                            cg = 210 - dist * 30;
                            cb = 40;
                            isGlow = 1;
                        } else if (dist > 0.45) {
                            // Layer 2: Lotus Petals Pink/Salmon (กลีบบัวสีชมพูอ่อนถึงบานเย็น)
                            const charIdx = (Math.abs(dc * 7 + dr * 11) + Math.floor(t * 2)) % DENSE_CHARS.length;
                            ch = DENSE_CHARS[charIdx];
                            cr = 245;
                            cg = 120 + Math.sin(dc) * 30;
                            cb = 175;
                            isGlow = 1;
                        } else {
                            // Layer 3: Radiant Golden-White Lotus Core (ใจกลางกระทงสว่างจ้า)
                            const charIdx = (Math.abs(dc * 3 + dr * 5) + Math.floor(t * 4)) % DENSE_CHARS.length;
                            ch = DENSE_CHARS[charIdx];
                            cr = 255;
                            cg = 245;
                            cb = 190;
                            isGlow = 2;
                        }

                        gridChar[r][c] = ch;
                        gridR[r][c] = cr;
                        gridG[r][c] = cg;
                        gridB[r][c] = cb;
                        gridGlow[r][c] = isGlow;
                    }
                }
            }

            // Candle & Flickering Flame (เทียนและเปลวไฟสั่นไหวแนวตั้ง)
            const flameHeight = Math.floor(rows * 0.18);
            const flickerX = Math.sin(t * 16.0) * 0.7;

            for (let fh = 0; fh <= flameHeight; fh++) {
                const r = actualKrathongRow - Math.floor(khRows * 0.5) - fh;
                if (r < 0 || r >= rows) continue;
                const prog = fh / flameHeight;
                const spread = Math.max(0, Math.floor((1.0 - prog) * 2.5));

                for (let fdc = -spread; fdc <= spread; fdc++) {
                    const c = centerCol + fdc + Math.floor(flickerX * prog);
                    if (c < 0 || c >= cols) continue;

                    let ch = "1";
                    let cr = 255, cg = 255, cb = 255;
                    if (prog < 0.3) {
                        // White-hot core
                        ch = (fdc === 0) ? "1" : "!";
                        cr = 255; cg = 255; cb = 230;
                    } else if (prog < 0.7) {
                        // Golden Yellow
                        ch = (fdc === 0) ? "1" : "|";
                        cr = 255; cg = 200; cb = 60;
                    } else {
                        // Orange Flame tip
                        ch = "*";
                        cr = 255; cg = 100; cb = 20;
                    }

                    gridChar[r][c] = ch;
                    gridR[r][c] = cr;
                    gridG[r][c] = cg;
                    gridB[r][c] = cb;
                    gridGlow[r][c] = 2;
                }
            }

            // Sparks rising from the flame
            for (let sp = 0; sp < 12; sp++) {
                const sPhase = ((t * 2.0 + sp * 0.28) % 1.0);
                const sr = actualKrathongRow - flameHeight - Math.floor(sPhase * rows * 0.15);
                const sc = centerCol + Math.floor(Math.sin(sp * 2.7 + t * 4) * 4);
                if (sr >= 0 && sr < rows && sc >= 0 && sc < cols) {
                    gridChar[sr][sc] = sp % 2 === 0 ? "1" : "*";
                    gridR[sr][sc] = 255;
                    gridG[sr][sc] = 160 * (1.0 - sPhase);
                    gridB[sr][sc] = 40;
                    gridGlow[sr][sc] = 1;
                }
            }

            // 7. GIANT WATER REFLECTION (เงาสะท้อนกระทงและเปลวไฟทอดยาวลงผิวน้ำ)
            const reflStartRow = actualKrathongRow + khRows;
            const maxReflRows = Math.floor(rows * 0.40);

            for (let dr = 0; dr < maxReflRows; dr++) {
                const r = reflStartRow + dr;
                if (r >= rows) break;
                const reflProg = dr / maxReflRows;
                const waveShift = Math.floor(Math.sin(dr * 0.4 + t * 4.2) * 3.5);

                const sourceR = Math.max(actualKrathongRow - khRows, actualKrathongRow + Math.floor(khRows * 0.5) - Math.floor(dr * 0.5));
                const spread = Math.floor(kwCols * (1.0 - reflProg * 0.45));

                for (let dc = -spread; dc <= spread; dc++) {
                    const c = centerCol + dc + waveShift;
                    if (c < 0 || c >= cols) continue;

                    // Wave disruption check
                    if ((c + r + Math.floor(t * 3)) % 4 === 0) continue;

                    const sc = centerCol + dc;
                    if (sc >= 0 && sc < cols && gridChar[sourceR][sc] !== " ") {
                        const origR = gridR[sourceR][sc];
                        const origG = gridG[sourceR][sc];
                        const origB = gridB[sourceR][sc];

                        // Blend reflection with deep blue water
                        const decay = (1.0 - reflProg * 0.75);
                        gridChar[r][c] = (dc === 0) ? "|" : ((r + c) % 2 === 0 ? "~" : "=");
                        gridR[r][c] = Math.min(255, origR * 0.65 * decay);
                        gridG[r][c] = Math.min(255, (origG * 0.70 + 30) * decay);
                        gridB[r][c] = Math.min(255, (origB * 0.60 + 80) * decay);
                        if (reflProg < 0.3) gridGlow[r][c] = 1;
                    }
                }
            }

            // 8. WATER PETALS / SPARKS (กลุ่มตัวอักษรดอกไม้/พิกเซลลอยน้ำ 111111, &o)
            for (let wsp of waterSparks) {
                const wr = Math.floor(wsp.y * rows);
                const wc = Math.floor(wsp.x * cols);
                const lines = wsp.text.split("\n");
                for (let l = 0; l < lines.length; l++) {
                    const r = wr + l;
                    if (r >= horizonRow && r < rows) {
                        for (let k = 0; k < lines[l].length; k++) {
                            const c = wc + k;
                            if (c >= 0 && c < cols) {
                                gridChar[r][c] = lines[l][k];
                                gridR[r][c] = 90;
                                gridG[r][c] = 230;
                                gridB[r][c] = 110;
                                gridGlow[r][c] = 1;
                            }
                        }
                    }
                }
            }

            // 9. DRAW PASS: RENDER ALL ASCII CHARACTERS WITH REALISTIC BLOOM
            ctx.font = `bold ${FONT_SIZE}px 'Consolas', 'Courier New', monospace`;
            ctx.textBaseline = "top";

            // Pass 1: Glowing / Bloom pass (วาดเงาแสงเรือง)
            for (let r = 0; r < rows; r++) {
                const yPos = r * CHAR_H;
                for (let c = 0; c < cols; c++) {
                    const glowLevel = gridGlow[r][c];
                    if (glowLevel > 0) {
                        const ch = gridChar[r][c];
                        const xPos = c * CHAR_W;
                        const red = gridR[r][c];
                        const green = gridG[r][c];
                        const blue = gridB[r][c];

                        ctx.shadowColor = `rgb(${red}, ${green}, ${blue})`;
                        ctx.shadowBlur = glowLevel === 2 ? 14 : 7;
                        ctx.fillStyle = `rgb(${red}, ${green}, ${blue})`;
                        ctx.fillText(ch, xPos, yPos);
                    }
                }
            }

            // Reset shadow blur for crisp text pass
            ctx.shadowBlur = 0;

            // Pass 2: Sharp foreground character pass
            for (let r = 0; r < rows; r++) {
                const yPos = r * CHAR_H;
                for (let c = 0; c < cols; c++) {
                    const ch = gridChar[r][c];
                    if (ch !== " ") {
                        const xPos = c * CHAR_W;
                        const red = gridR[r][c];
                        const green = gridG[r][c];
                        const blue = gridB[r][c];
                        ctx.fillStyle = `rgb(${red}, ${green}, ${blue})`;
                        ctx.fillText(ch, xPos, yPos);
                    }
                }
            }

            requestAnimationFrame(render);
        }

        render();
    </script>
</body>
</html>
