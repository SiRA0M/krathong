<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loy Krathong Pure ASCII Art</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000000;
        }
        body, html {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        canvas {
            display: block;
            image-rendering: auto;
        }
    </style>
</head>
<body>
    <canvas id="asciiCanvas"></canvas>

    <script>
        const canvas = document.getElementById('asciiCanvas');
        const ctx = canvas.getContext('2d');

        // Fixed Grid Resolution for exact artistic pixel alignment
        // Vertical 9:16 layout (e.g. 64 cols x 96 rows)
        const COLS = 66;
        const ROWS = 96;

        let charW = 10;
        let charH = 15;
        let offsetX = 0;
        let offsetY = 0;

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            // Fit 66x96 grid into window keeping aspect ratio
            const scaleH = canvas.height / (ROWS * 1.45);
            const scaleW = canvas.width / (COLS * 0.95);
            const scale = Math.min(scaleW, scaleH);

            charW = scale * 0.95;
            charH = scale * 1.45;

            offsetX = Math.floor((canvas.width - COLS * charW) / 2);
            offsetY = Math.floor((canvas.height - ROWS * charH) / 2);
        }
        window.addEventListener('resize', resize);
        resize();

        // 1. SKY STARS (ดาวดวงเล็กๆ กระจายเต็มฟ้า)
        const stars = [];
        const starChars = [".", "+", "*", "·", "'", "`"];
        for (let i = 0; i < 65; i++) {
            stars.push({
                c: Math.floor(Math.random() * COLS),
                r: Math.floor(Math.random() * 42),
                char: starChars[Math.floor(Math.random() * starChars.length)],
                speed: 1.5 + Math.random() * 2.5,
                phase: Math.random() * Math.PI * 2
            });
        }

        // 2. SKY LANTERNS: 4 ORANGE GLOWING CLUSTERS (กลุ่มตัวอักษรส้มลอยกลางฟ้า 4 จุด)
        // ซ้ายบน 2 จุด, กลางบน 1 จุด, ขวากลาง 1 จุด
        const lanterns = [
            // ซ้ายบน จุดที่ 1 (สูงกว่า)
            {
                c: 18, r: 16,
                lines: ["7&8#", "#8*:"],
                speed: 0.015,
                seed: 1.2
            },
            // ซ้ายบน จุดที่ 2 (ต่ำกว่า)
            {
                c: 29, r: 26,
                lines: ["488", "1&85"],
                speed: 0.012,
                seed: 2.5
            },
            // กลางบน 1 จุด
            {
                c: 35, r: 11,
                lines: ["100#", "%&0#*", "9&8"],
                speed: 0.010,
                seed: 3.8
            },
            // ขวากลาง 1 จุด
            {
                c: 43, r: 21,
                lines: ["84&#", "%&0#*", "7#"],
                speed: 0.014,
                seed: 4.9
            }
        ];

        // 3. MOON SHAPE TEMPLATE (@ กับ 0 หนาแน่น สีขาวนวล)
        const moonLines = [
            "    #@0000000@..   ",
            "  +0&@000000&0000+ ",
            " 000000000&000000  ",
            "000000&0000000000  ",
            "0000000000000000   ",
            " 000000000000000   ",
            " &00000000000000   ",
            "  +000000000000    ",
            "   +0000000000     ",
            "     +000000       "
        ];

        // 4. LEFT GABLED BUILDING & WINDOWS (อาคารหลังคาสูงทรงจั่ว มีแถวหน้าต่างส่องไฟส้ม)
        const leftWindows = [
            { text: "%+  %0  #M  %+  %%  #%  MM", r: 42, c: 3 },
            { text: "%+  %+  %+  %+  %+  %+  ##", r: 44, c: 3 }
        ];

        // 5. WATER SCATTERED SPARKLES (จุดแสงเขียว เหลือง ส้มเล็กๆ กระจายบนน้ำสีเขียวเข้ม)
        const waterLights = [];
        for (let i = 0; i < 40; i++) {
            waterLights.push({
                c: Math.floor(Math.random() * COLS),
                r: 47 + Math.floor(Math.random() * 47),
                type: Math.random() > 0.4 ? 'green' : (Math.random() > 0.5 ? 'orange' : 'yellow'),
                char: Math.random() > 0.6 ? "·" : (Math.random() > 0.5 ? "+" : "~"),
                speed: 1.0 + Math.random() * 3.0,
                phase: Math.random() * Math.PI * 2
            });
        }

        // 6. BOTTOM-LEFT GREEN PATCHES (มุมซ้ายล่างมีกลุ่ม ||| สีเขียวสว่างเป็นหย่อมๆ)
        const greenPatches = [
            { c: 8,  r: 66, text: "1111" },
            { c: 4,  r: 83, text: "111111" },
            { c: 50, r: 73, text: "1101" },
            { c: 51, r: 87, text: "111111" },
            { c: 58, r: 85, text: "&o" },
            { c: 21, r: 90, text: "00" }
        ];

        const startTime = Date.now();

        function render() {
            const t = (Date.now() - startTime) * 0.001;

            // Clear black screen
            ctx.fillStyle = "#000000";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Grid Buffers
            const gridChar = new Array(ROWS);
            const gridR = new Array(ROWS);
            const gridG = new Array(ROWS);
            const gridB = new Array(ROWS);
            const gridGlow = new Array(ROWS); // 0=None, 1=Soft, 2=Intense

            for (let r = 0; r < ROWS; r++) {
                gridChar[r] = new Array(COLS).fill(" ");
                gridR[r] = new Float32Array(COLS);
                gridG[r] = new Float32Array(COLS);
                gridB[r] = new Float32Array(COLS);
                gridGlow[r] = new Uint8Array(COLS);
            }

            const horizonR = 45;

            // ==========================================
            // 1. SKY & STARS (ฟ้ามืดสนิทและดาวดวงเล็กๆ)
            // ==========================================
            for (let s of stars) {
                if (s.r < horizonR) {
                    const shimmer = Math.sin(t * s.speed + s.phase) * 0.5 + 0.5;
                    if (shimmer > 0.3) {
                        gridChar[s.r][s.c] = s.char;
                        const bright = 170 + shimmer * 85;
                        gridR[s.r][s.c] = bright;
                        gridG[s.r][s.c] = bright;
                        gridB[s.r][s.c] = Math.min(255, bright + 10);
                        if (shimmer > 0.85) gridGlow[s.r][s.c] = 1;
                    }
                }
            }

            // ==========================================
            // 2. FULL MOON (มุมขวาบน @ กับ 0 ขาวนวลเรืองแสง)
            // ==========================================
            const moonStartC = 46;
            const moonStartR = 9;
            const moonCenterC = moonStartC + 7;
            const moonCenterR = moonStartR + 5;

            // Moon Outer Glow Halo
            for (let dr = -6; dr <= 15; dr++) {
                const r = moonStartR + dr;
                if (r < 0 || r >= horizonR) continue;
                for (let dc = -7; dc <= 21; dc++) {
                    const c = moonStartC + dc;
                    if (c < 0 || c >= COLS) continue;
                    const dNorm = Math.sqrt(((dc - 7) / 8.5) ** 2 + ((dr - 5) / 6.5) ** 2);
                    if (dNorm > 0.95 && dNorm <= 1.7) {
                        const aura = (1.0 - (dNorm - 0.95) / 0.75);
                        if (Math.random() < aura * 0.45) {
                            gridChar[r][c] = (dr + dc) % 2 === 0 ? "·" : "+";
                            gridR[r][c] = 230 * aura;
                            gridG[r][c] = 220 * aura;
                            gridB[r][c] = 190 * aura;
                            gridGlow[r][c] = 1;
                        }
                    }
                }
            }

            // Moon Solid @ and 0 Body
            for (let mr = 0; mr < moonLines.length; mr++) {
                const line = moonLines[mr];
                const r = moonStartR + mr;
                if (r >= horizonR) continue;
                for (let mc = 0; mc < line.length; mc++) {
                    const ch = line[mc];
                    const c = moonStartC + mc;
                    if (ch !== " " && c >= 0 && c < COLS) {
                        gridChar[r][c] = ch;
                        gridR[r][c] = 255;
                        gridG[r][c] = 250;
                        gridB[r][c] = 230;
                        gridGlow[r][c] = 2; // Intense bloom
                    }
                }
            }

            // ==========================================
            // 3. SKY LANTERNS (4 จุดส้มลอยกลางฟ้า)
            // ==========================================
            for (let lant of lanterns) {
                const curR = Math.floor(((lant.r - t * lant.speed * 25) % (horizonR - 8) + (horizonR - 8)) % (horizonR - 8)) + 3;
                const flicker = Math.sin(t * 12 + lant.seed) * 0.2 + 0.8;
                for (let lr = 0; lr < lant.lines.length; lr++) {
                    const line = lant.lines[lr];
                    const r = curR + lr;
                    if (r >= 0 && r < horizonR) {
                        for (let lc = 0; lc < line.length; lc++) {
                            const c = lant.c + lc - Math.floor(line.length / 2);
                            if (c >= 0 && c < COLS) {
                                gridChar[r][c] = line[lc];
                                gridR[r][c] = 255;
                                gridG[r][c] = Math.floor(165 * flicker);
                                gridB[r][c] = 40;
                                gridGlow[r][c] = 2;
                            }
                        }
                    }
                }
            }

            // ==========================================
            // 4. HORIZON SILHOUETTES (แนวเส้นขอบฟ้า)
            // ==========================================
            // A. ซ้าย: อาคารหลังคาสูงทรงจั่ว (Gabled building)
            const gableCenterC = 12;
            const gableW = 10;
            const gableH = 14;
            for (let dc = -gableW; dc <= gableW; dc++) {
                const c = gableCenterC + dc;
                if (c < 0 || c >= COLS) continue;
                const roofProg = Math.sqrt(Math.max(0, 1.0 - (dc / gableW) ** 2));
                const topR = horizonR - Math.floor(roofProg * gableH);
                for (let r = topR; r <= horizonR; r++) {
                    if (r === topR || Math.abs(dc) === gableW) {
                        gridChar[r][c] = "%";
                        gridR[r][c] = 160; gridG[r][c] = 90; gridB[r][c] = 35;
                        gridGlow[r][c] = 1;
                    }
                }
            }

            // แถวหน้าต่างส่องไฟส้มเรียงแถว
            for (let win of leftWindows) {
                const r = win.r;
                for (let i = 0; i < win.text.length; i++) {
                    const c = win.c + i;
                    const ch = win.text[i];
                    if (ch !== " " && c >= 0 && c < COLS) {
                        gridChar[r][c] = ch;
                        gridR[r][c] = 255;
                        gridG[r][c] = 160;
                        gridB[r][c] = 30;
                        gridGlow[r][c] = 1;
                    }
                }
            }

            // B. ขวา: ภูเขา/เจดีย์ทรงสามเหลี่ยมสูง ซิลูเอตมืด
            const mountainTipC = 56;
            const mountainW = 10;
            const mountainH = 22;
            for (let dc = -mountainW; dc <= mountainW; dc++) {
                const c = mountainTipC + dc;
                if (c < 0 || c >= COLS) continue;
                const prog = 1.0 - Math.abs(dc) / mountainW;
                const topR = horizonR - Math.floor((prog ** 1.8) * mountainH);
                for (let r = topR; r <= horizonR; r++) {
                    if (r === topR || Math.abs(dc) === mountainW) {
                        gridChar[r][c] = "#";
                        gridR[r][c] = 140; gridG[r][c] = 75; gridB[r][c] = 30;
                        gridGlow[r][c] = 1;
                    }
                }
            }

            // แสงไฟเล็กๆ ที่เชิงเขาขวา
            for (let bc = mountainTipC - 8; bc <= mountainTipC + 8; bc += 3) {
                if (bc >= 0 && bc < COLS) {
                    gridChar[horizonR - 1][bc] = "+";
                    gridR[horizonR - 1][bc] = 230;
                    gridG[horizonR - 1][bc] = 140;
                    gridB[horizonR - 1][bc] = 40;
                    gridGlow[horizonR - 1][bc] = 1;
                }
            }

            // C. กลาง: ยอดแหลมเรียวหลายยอด และแสงทองสว่างที่สุดในภาพ
            const centerC = 33;
            // Spire tips (11, 1, |, !)
            const spires = [
                { c: centerC - 2, h: 10, chars: ["1", "1", "|", "!", "!"] },
                { c: centerC,     h: 15, chars: ["1", "1", "1", "|", "!"] },
                { c: centerC + 2, h: 11, chars: ["1", "1", "|", "!"] }
            ];
            for (let sp of spires) {
                for (let i = 0; i < sp.h; i++) {
                    const r = horizonR - sp.h + i;
                    if (r >= 0 && r < horizonR) {
                        const ch = sp.chars[i % sp.chars.length];
                        gridChar[r][sp.c] = ch;
                        gridR[r][sp.c] = 255;
                        gridG[r][sp.c] = 180 + (i / sp.h) * 60;
                        gridB[r][sp.c] = 50;
                        gridGlow[r][sp.c] = 2;
                    }
                }
            }

            // Intense golden explosion of light at the center base
            for (let dr = -6; dr <= 2; dr++) {
                const r = horizonR + dr;
                for (let dc = -8; dc <= 8; dc++) {
                    const c = centerC + dc;
                    if (c >= 0 && c < COLS && r >= 0 && r < ROWS) {
                        const dist = Math.sqrt((dc / 7) ** 2 + (dr / 5) ** 2);
                        if (dist <= 1.0) {
                            const intensity = 1.0 - dist;
                            gridR[r][c] = Math.min(255, gridR[r][c] + 255 * intensity);
                            gridG[r][c] = Math.min(255, gridG[r][c] + 220 * intensity);
                            gridB[r][c] = Math.min(255, gridB[r][c] + 120 * intensity);
                            gridGlow[r][c] = 2;
                        }
                    }
                }
            }

            // ==========================================
            // 5. DEEP DARK GREEN WATER (ผิวน้ำสีเขียวเข้มเกือบดำ)
            // ==========================================
            for (let r = horizonR + 1; r < ROWS; r++) {
                const depthProg = (r - horizonR) / (ROWS - horizonR);
                for (let c = 0; c < COLS; c++) {
                    const wave = Math.sin(c * 0.28 + r * 0.70 + t * 2.8);
                    // Dark green water characters
                    if (wave > 0.45) {
                        gridChar[r][c] = (c + r) % 3 === 0 ? "~" : "-";
                        gridR[r][c] = 6 + 6 * depthProg;
                        gridG[r][c] = 28 + 18 * (1.0 - depthProg);
                        gridB[r][c] = 16 + 12 * (1.0 - depthProg);
                    } else if (wave < -0.55) {
                        gridChar[r][c] = "/";
                        gridR[r][c] = 4;
                        gridG[r][c] = 18;
                        gridB[r][c] = 12;
                    }
                }
            }

            // ==========================================
            // 6. MAIN GLOWING ORB / KRATHONG (วัตถุทรงกลมใหญ่เรืองแสงกลางภาพ)
            // บน: ส้ม-ชมพู-ทอง | ล่าง: ขอบเขียวมะนาว
            // ==========================================
            const orbC = centerC;
            const orbR = 52;
            const orbRadiusC = 16;
            const orbRadiusR = 8;
            const bob = Math.sin(t * 2.4) * 0.5;
            const curOrbR = orbR + Math.floor(bob);

            for (let dr = -orbRadiusR; dr <= orbRadiusR; dr++) {
                const r = curOrbR + dr;
                if (r < horizonR || r >= ROWS) continue;
                for (let dc = -orbRadiusC; dc <= orbRadiusC; dc++) {
                    const c = orbC + dc;
                    if (c < 0 || c >= COLS) continue;

                    const normDist = Math.sqrt((dc / orbRadiusC) ** 2 + (dr / orbRadiusR) ** 2);
                    if (normDist <= 1.0) {
                        const dist = normDist;
                        let ch = "@";
                        let red = 255, green = 255, blue = 255, glow = 2;

                        if (dr > orbRadiusR * 0.25 || dist > 0.78) {
                            // ส่วนล่างและขอบนอก: เขียวมะนาวสดใส (Lime Green 1, 0, &, 8, %, o)
                            const limeChars = ["1", "0", "&", "8", "%", "+", "o", "0"];
                            ch = limeChars[(Math.abs(dc * 5 + dr * 7) + Math.floor(t * 3)) % limeChars.length];
                            red = 145 - dist * 40;
                            green = 225 - dist * 25;
                            blue = 30;
                            glow = 1;
                        } else if (dr < 0 && dist > 0.35) {
                            // ส่วนบน: ส้ม-ชมพู-ทอง (Orange, Pink & Gold)
                            const pinkChars = ["@", "%", "#", "&", "8", "0", "W"];
                            ch = pinkChars[(Math.abs(dc * 7 + dr * 11) + Math.floor(t * 2)) % pinkChars.length];
                            red = 255;
                            green = 145 + Math.sin(dc * 0.5) * 35;
                            blue = 170;
                            glow = 2;
                        } else {
                            // ใจกลางสว่างจ้าที่สุด: ขาวนวล-ทอง (Radiant Golden-White Core)
                            const coreChars = ["0", "0", "&", "8", "%", "#", "@"];
                            ch = coreChars[(Math.abs(dc * 3 + dr * 5) + Math.floor(t * 4)) % coreChars.length];
                            red = 255;
                            green = 250;
                            blue = 215;
                            glow = 2;
                        }

                        gridChar[r][c] = ch;
                        gridR[r][c] = red;
                        gridG[r][c] = green;
                        gridB[r][c] = blue;
                        gridGlow[r][c] = glow;
                    }
                }
            }

            // ==========================================
            // 7. SOFT REFLECTION BELOW ON WATER (เงาสะท้อนจางๆ ใต้ลงมา)
            // ==========================================
            const reflStartR = curOrbR + orbRadiusR;
            const maxReflR = 26;

            for (let dr = 0; dr < maxReflR; dr++) {
                const r = reflStartR + dr;
                if (r >= ROWS) break;
                const prog = dr / maxReflR;
                const waveShift = Math.floor(Math.sin(dr * 0.45 + t * 3.8) * 2.5);
                const srcR = Math.max(curOrbR - orbRadiusR, curOrbR + Math.floor(orbRadiusR * 0.5) - Math.floor(dr * 0.6));
                const spread = Math.floor(orbRadiusC * (1.0 - prog * 0.55));

                for (let dc = -spread; dc <= spread; dc++) {
                    const c = orbC + dc + waveShift;
                    if (c < 0 || c >= COLS) continue;
                    if ((c + r + Math.floor(t * 2)) % 4 === 0) continue;

                    const sc = orbC + dc;
                    if (sc >= 0 && sc < COLS && gridChar[srcR][sc] !== " ") {
                        const decay = (1.0 - prog * 0.85);
                        gridChar[r][c] = (dc === 0) ? "|" : ((r + c) % 2 === 0 ? "~" : "=");
                        // Blend softly with dark green water
                        gridR[r][c] = Math.min(255, gridR[srcR][sc] * 0.45 * decay + 10);
                        gridG[r][c] = Math.min(255, gridG[srcR][sc] * 0.55 * decay + 35);
                        gridB[r][c] = Math.min(255, gridB[srcR][sc] * 0.30 * decay + 15);
                        if (prog < 0.25) gridGlow[r][c] = 1;
                    }
                }
            }

            // ==========================================
            // 8. WATER SCATTERED SPARKLES (จุดแสงเขียว เหลือง ส้มเล็กๆ กระจายบนน้ำ)
            // ==========================================
            for (let wl of waterLights) {
                const shimmer = Math.sin(t * wl.speed + wl.phase) * 0.5 + 0.5;
                if (shimmer > 0.45 && gridChar[wl.r][wl.c] === " ") {
                    gridChar[wl.r][wl.c] = wl.char;
                    if (wl.type === 'green') {
                        gridR[wl.r][wl.c] = 80 * shimmer;
                        gridG[wl.r][wl.c] = 230 * shimmer;
                        gridB[wl.r][wl.c] = 90 * shimmer;
                    } else if (wl.type === 'yellow') {
                        gridR[wl.r][wl.c] = 240 * shimmer;
                        gridG[wl.r][wl.c] = 220 * shimmer;
                        gridB[wl.r][wl.c] = 60 * shimmer;
                    } else {
                        gridR[wl.r][wl.c] = 250 * shimmer;
                        gridG[wl.r][wl.c] = 140 * shimmer;
                        gridB[wl.r][wl.c] = 30 * shimmer;
                    }
                    if (shimmer > 0.8) gridGlow[wl.r][wl.c] = 1;
                }
            }

            // ==========================================
            // 9. BOTTOM-LEFT GREEN PATCHES (กลุ่ม ||| หรือ 111111 สีเขียวสว่าง)
            // ==========================================
            for (let gp of greenPatches) {
                const r = gp.r;
                if (r >= horizonR && r < ROWS) {
                    for (let i = 0; i < gp.text.length; i++) {
                        const c = gp.c + i;
                        if (c >= 0 && c < COLS) {
                            gridChar[r][c] = gp.text[i];
                            gridR[r][c] = 110;
                            gridG[r][c] = 240;
                            gridB[r][c] = 85;
                            gridGlow[r][c] = 1;
                        }
                    }
                }
            }

            // ==========================================
            // 10. TWO-PASS CANVAS RENDERING (REALISTIC BLOOM GLOW)
            // ==========================================
            ctx.font = `bold ${Math.floor(charH)}px 'Consolas', 'Courier New', monospace`;
            ctx.textBaseline = "top";

            // Pass 1: Soft Ambient Bloom Glow (แสงเรืองอุ่นรอบตัวอักษร)
            for (let r = 0; r < ROWS; r++) {
                const y = offsetY + r * charH;
                for (let c = 0; c < COLS; c++) {
                    const glow = gridGlow[r][c];
                    if (glow > 0) {
                        const ch = gridChar[r][c];
                        const x = offsetX + c * charW;
                        const red = gridR[r][c];
                        const green = gridG[r][c];
                        const blue = gridB[r][c];

                        ctx.shadowColor = `rgb(${red}, ${green}, ${blue})`;
                        ctx.shadowBlur = (glow === 2) ? 14 : 7;
                        ctx.fillStyle = `rgb(${red}, ${green}, ${blue})`;
                        ctx.fillText(ch, x, y);
                    }
                }
            }

            // Pass 2: Sharp Crisp Monospace Characters (ตัวอักษรคมชัดด้านหน้า)
            ctx.shadowBlur = 0;
            for (let r = 0; r < ROWS; r++) {
                const y = offsetY + r * charH;
                for (let c = 0; c < COLS; c++) {
                    const ch = gridChar[r][c];
                    if (ch !== " ") {
                        const x = offsetX + c * charW;
                        const red = gridR[r][c];
                        const green = gridG[r][c];
                        const blue = gridB[r][c];
                        ctx.fillStyle = `rgb(${red}, ${green}, ${blue})`;
                        ctx.fillText(ch, x, y);
                    }
                }
            }

            requestAnimationFrame(render);
        }

        render();
    </script>
</body>
</html>
